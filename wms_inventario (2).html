/* ---------- 5.3 HOJA DE CONTEO ---------- */
VIEWS.captura=(p)=>{
  const abiertos=DB.conteos.filter(enConteo);
  const c=DB.conteo(p&&p.id)||abiertos[0];
  if(!c){ APP.ir('inventario',{etapa:'Contar'}); return; }
  ST.cap??={f:{modo:'Todas'}};
  ST.cap.id=c.id;
  ST.cap.render=()=>VIEWS.captura({id:c.id});
  const f=ST.cap.f;
  const editable = c.estado==='ABIERTO';
  /* CONTEO CIEGO: mientras se cuenta no se ve sistema, diferencia, valor ni estado. */

  /* Orden de recorrido físico: por ubicación, como camina el contador */
  let filas=[...c.lineas].sort((a,b)=>U.col.compare(a.ub,b.ub)||U.col.compare(a.sku,b.sku));
  if(f.modo==='Pendientes')   filas=filas.filter(l=>l.fisico==null);

  /* La hoja se dibuja por bloques */
  const porHoja=Math.max(20,CFG.lineasPorHoja||150);
  const bloques=Math.max(1,Math.ceil(filas.length/porHoja));
  if(f.bloque==null||f.bloque>=bloques) f.bloque=0;

  /* Filas y pie como funciones */
  const filaHTML=(l,i)=>{
    return `<tr data-id="${l.stockId}">
          <td class="c muted" data-l="#">${i+1}</td>
          <td class="mono" data-l="Ubicación">${l.ub}</td>
          <td class="mono" data-l="SKU">${l.sku}</td>
          <td data-l="Descripción">${U.esc(l.desc)}</td>
          <td class="mono" data-l="Lote">${l.lote}</td>
          <td class="c" data-l="UM">${l.um}</td>
          <td class="r" data-l="Contado"><span class="cap-wrap">
              <button class="btn xs mov" data-menos="${l.stockId}" ${editable?'':'disabled'}>−</button>
              <input class="cap" inputmode="numeric" data-id="${l.stockId}"
                value="${l.fisico??''}" ${editable?'':'disabled'}>
              <button class="btn xs mov" data-mas="${l.stockId}" ${editable?'':'disabled'}>+</button>
            </span></td></tr>`;
  };
  const bloqueHTML=n=>{
    const d0=n*porHoja, vis=filas.slice(d0,d0+porHoja);
    return vis.length ? vis.map((l,i)=>filaHTML(l,d0+i)).join('')
                      : `<tr><td class="t-empty" colspan="7">No hay líneas en esta vista.</td></tr>`;
  };
  const pagHTML=n=>{
    const d0=n*porHoja, vis=Math.min(porHoja,filas.length-d0);
    return `<span>Líneas ${U.n(filas.length?d0+1:0)}–${U.n(d0+Math.max(0,vis))} de ${U.n(filas.length)}
         ${filas.length!==c.lineas.length?' (filtradas de '+U.n(c.lineas.length)+')':''}</span>
       ${bloques>1?`<span class="inline" style="margin-left:10px">
         <button class="btn xs" data-bloque="${n-1}" ${n===0?'disabled':''}>‹ Bloque anterior</button>
         <b>${n+1} / ${bloques}</b>
         <button class="btn xs" data-bloque="${n+1}" ${n===bloques-1?'disabled':''}>Bloque siguiente ›</button>
       </span>`:''}
`;
  };


  el('view').innerHTML=hdInv('Contar',
    'Escriba la cantidad que cuenta en cada línea.',
    `<button class="btn pri" id="btn-fin" ${editable?'':'disabled'}>Terminar</button>`+
    UI.mas([{txt:'Exportar hoja',fn:()=>ST.cap.exportar()},
            {txt:'Eliminar inventario',fn:()=>ACC.eliminarConteo(c)}]))+
  `<div class="sheet-bar">
     <div class="sb-item"><span class="l">Inventario</span>
       ${abiertos.length>1
         ? `<select id="inv-sel">${abiertos.map(x=>`<option value="${x.id}" ${
             x.id===c.id?'selected':''}>${x.id} - zona ${x.zona} - ${DB.avance(x).h}/${DB.avance(x).t}</option>`).join('')}</select>`
         : `<b>${c.id}</b>`}</div>
     <div class="sb-item"><span class="l">Zona</span><b>${c.zona}</b></div>
     <div class="sb-item no-mov"><span class="l">Contador</span><b>${U.esc(c.responsable)}</b></div>
     <div class="sb-item"><span class="l">Avance</span><b id="rs-avance">0/0</b>
       <span class="bar" style="width:90px"><i id="rs-barra" style="width:0%"></i></span>
       <b id="rs-pct" style="width:52px;text-align:right"></b></div>
     <div class="sb-item" style="margin-left:auto">
       <span class="l">Ir a</span>
       <input type="text" id="scan" placeholder="Ubicación, SKU o lote + Enter" style="width:230px" ${editable?'':'disabled'}>
     </div>
     <div class="sb-item">
       <select id="modo">${opts(['Todas','Pendientes'],f.modo)}</select>
     </div>
   </div>
   <div class="panel">
     <div class="tbl-wrap" style="max-height:calc(100vh - 190px)">
      <table class="t hoja">
        <thead><tr>
          <th class="c" style="width:34px">#</th>
          <th style="width:104px">Ubicación</th>
          <th style="width:96px">SKU</th>
          <th>Descripción</th>
          <th style="width:96px">Lote</th>
          <th style="width:42px" class="c">UM</th>
          <th style="width:150px" class="r">Contado</th>
        </tr></thead>
        <tbody>${bloqueHTML(f.bloque)}</tbody>
      </table>
     </div>
     <div class="pag" id="cap-pag">${pagHTML(f.bloque)}</div>
   </div>
   <div class="muted">Enter o flecha abajo pasa a la linea siguiente - Suprimir borra la cantidad.
   El sistema y las diferencias se ven al pulsar Terminar.</div>`;

  /* --- Resumen: se recalcula sin volver a dibujar la tabla ------------- */
  const refrescar=()=>{
    const a=DB.avance(c);
    el('rs-avance').textContent=a.h+'/'+a.t;
    el('rs-barra').style.width=a.pct+'%';
    el('rs-barra').className=a.pct===100?'g':'';
    el('rs-pct').textContent=U.p(a.pct);
  };
  const guardar=(id,valor)=>{
    const l=c.lineas.find(x=>x.stockId==id);
    l.fisico = (valor===''||valor==null) ? null : Math.max(0,Math.round(+valor)||0);
    refrescar();
    DB.guardar();   /* cada cantidad capturada sobrevive a un F5 */
  };

  const ver=e=>{ if(e&&e.scrollIntoView) e.scrollIntoView({block:'center'}); };
  const tbody=el('view').querySelector('table.hoja tbody');
  const caps=()=>[...tbody.querySelectorAll('input.cap')];
  const linea=id=>c.lineas.find(x=>x.stockId==id);

  /* Un solo juego de escuchadores para toda la hoja (delegación). */
  const irBloque=(n,alFinal,id)=>{
    if(n<0||n>=bloques) return;
    f.bloque=n;
    tbody.innerHTML=bloqueHTML(n);            // solo el cuerpo: el resto no se toca
    el('cap-pag').innerHTML=pagHTML(n);
    enlazarBloques();
    const arr=caps();
    const t=id ? tbody.querySelector(`input.cap[data-id="${id}"]`)
               : (alFinal?arr[arr.length-1]:arr[0]);
    if(t&&editable){ t.focus(); ver(t); }
  };
  const enlazarBloques=()=>{
    el('view').querySelectorAll('[data-bloque]').forEach(b=>b.onclick=()=>irBloque(+b.dataset.bloque,false));
  };
  tbody.addEventListener('input',e=>{
    const i=e.target;
    if(i.classList&&i.classList.contains('cap')) guardar(i.dataset.id,i.value);
  });
  tbody.addEventListener('focusin',e=>{
    const i=e.target;
    if(i.classList&&i.classList.contains('cap')){ i.select(); setTimeout(()=>ver(i),300); }
  });
  tbody.addEventListener('keydown',e=>{
    const i=e.target;
    if(!i.classList||!i.classList.contains('cap')) return;
    const arr=caps(), k=arr.indexOf(i);
    const saltar=n=>{
      const t=arr[n];
      if(t){ t.focus(); ver(t); return; }
      if(n>=arr.length && f.bloque<bloques-1) irBloque(f.bloque+1,false);
      else if(n<0 && f.bloque>0) irBloque(f.bloque-1,true);
      else i.blur();
    };
    if(e.key==='Enter'||e.key==='ArrowDown'){ e.preventDefault(); saltar(k+1); }
    if(e.key==='ArrowUp'){ e.preventDefault(); saltar(k-1); }
  });
  const si=el('inv-sel');
  if(si) si.onchange=e=>APP.ir('captura',{id:e.target.value});

  tbody.addEventListener('click',e=>{
    const b=e.target.closest&&e.target.closest('button'); if(!b) return;
    const id=b.dataset.mas||b.dataset.menos; if(!id) return;
    const inp=tbody.querySelector(`input.cap[data-id="${id}"]`);
    const v=Math.max(0,(inp.value===''?0:(+inp.value||0))+(b.dataset.mas?1:-1));
    inp.value=v; guardar(id,v);
  });
  el('view').querySelectorAll('[data-bloque]').forEach(b=>b.onclick=()=>irBloque(+b.dataset.bloque,false));

  /* --- Ir a: escanear o teclear y saltar a la línea -------------------- */
  el('scan').addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    const q=el('scan').value.trim().toLowerCase();
    if(!q) return;
    const idx=filas.findIndex(l=>(l.ub+' '+l.sku+' '+l.lote).toLowerCase().includes(q));
    if(idx<0){ UI.msg('No se encontró "'+el('scan').value+'" en este conteo','err'); return; }
    el('scan').value='';
    const bl=Math.floor(idx/porHoja);
    if(bl!==f.bloque){ irBloque(bl,false,filas[idx].stockId); return; }
    const inp=tbody.querySelector(`input.cap[data-id="${filas[idx].stockId}"]`);
    ver(inp); inp.focus();
  });
  el('modo').onchange=e=>{ f.modo=e.target.value; f.bloque=0; ST.cap.render(); };

  /* --- Acciones de la hoja -------------------------------------------- */
  el('btn-fin').onclick=()=>ACC.terminar(c);
  ST.cap.exportar=()=>U.csv('conteo_'+c.id,[
    {key:'ub',label:'Ubicación'},{key:'sku',label:'SKU'},{key:'desc',label:'Descripción'},
    {key:'lote',label:'Lote'},{key:'um',label:'UM'},
    {key:'fis',label:'Contado',raw:l=>DB.fis(l)??''}],filas);
  bindEtapas(); UI.bindMas();
  refrescar();
  /* Al cambiar de bloque el foco continúa donde iba, no vuelve al inicio */
  const arr=caps();
  let destino=null;
  if(ST.cap.irA==='ultima')       destino=arr[arr.length-1];
  else if(ST.cap.irA==='primera') destino=arr[0];
  else if(ST.cap.irA)             destino=tbody.querySelector(`input.cap[data-id="${ST.cap.irA}"]`);
  else                            destino=arr.find(i=>i.value==='')||arr[0];
  ST.cap.irA=null;
  if(destino&&editable){ destino.focus(); ver(destino); }
};

/* ---------- 5.3b ARMAR CONTEO ------------------------------------------ El conteo se arma línea por línea. */
VIEWS.nuevo=()=>{
  ST.nv??={render:VIEWS.nuevo,
    f:{zona:'',clase:'',tipo:'',dias:'',q:''},
    sel:new Set(),
    cab:{tipo:CFG.tiposConteo[0],resp:CFG.responsables[0]||'',fecha:U.hoy(),criterio:''},
    azar:20};
  const f=ST.nv.f, sel=ST.nv.sel, cab=ST.nv.cab;
  const hoy=U.hoy();
  const dias=s=>Math.round((new Date(hoy)-new Date(s.ultConteo))/864e5);
  const porId=new Map(DB.stock.map(s=>[s.id,s]));

  /* Universo disponible según los filtros vigentes */
  const cand=DB.stock.filter(s=>{
    const p=DB.prod(s.sku);
    if(f.zona && s.zona!==f.zona) return false;
    if(f.clase && p.clase!==f.clase) return false;
    if(f.tipo && s.tipo!==f.tipo) return false;
    if(f.dias && dias(s) < +f.dias) return false;
    if(f.q){
      const q=f.q.toLowerCase();
      if(!(s.ub+' '+s.sku+' '+p.desc+' '+s.lote).toLowerCase().includes(q)) return false;
    }
    return true;
  });

  /* Resumen de lo seleccionado */
  const elegidas=[...sel].map(id=>porId.get(id)).filter(Boolean);
  const skus=new Set(elegidas.map(s=>s.sku)).size;
  const zonasSel=[...new Set(elegidas.map(s=>s.zona))].sort();

  el('view').innerHTML=hdInv('Planificar',
    'Elija qué líneas se van a contar: a mano, al azar o pegando una lista.',
    `<button class="btn pri" data-crear ${elegidas.length?'':'disabled'}>Crear conteo (${U.n(elegidas.length)})</button>`)+
  `<div class="sheet-bar">
     <div class="sb-item"><span class="l">Responsable</span>
       <input type="text" data-cab="resp" list="dl-resp" value="${U.esc(cab.resp)}" placeholder="Quien cuenta" style="width:150px">
       <datalist id="dl-resp">${CFG.responsables.map(r=>`<option value="${U.esc(r)}">`).join('')}</datalist></div>
   </div>
   <div class="panel">
     <div class="filters">
       <div class="f"><label>Buscar artículo, ubicación o lote</label>
         <input type="text" data-q value="${U.esc(f.q)}" placeholder="SKU, descripción, ubicación o lote"></div>
       <div class="f"><label>Zona</label><select data-z>${opts([''].concat(CFG.zonas),f.zona)}</select></div>
       <div class="f"><label>Clase ABC</label><select data-cl>${opts(['','A','B','C'],f.clase)}</select></div>
       <div class="f"><label>Ubicación</label><select data-tu>${opts(['','RACK','PISO'],f.tipo)}</select></div>
       <div class="f"><label>Sin contar hace (días)</label>
         <input type="number" data-dias value="${f.dias}" min="0" step="5" placeholder="cualquiera" style="width:110px"></div>
       <div class="f"><label>&nbsp;</label><button class="btn" data-limpiar>Limpiar filtros</button></div>
     </div>
     <div class="filters">
       <div class="f"><label>Agregar a la selección</label>
         <span class="inline">
           <button class="btn" data-todo>Todo lo filtrado (${U.n(cand.length)})</button>
           <input type="number" data-n value="${ST.nv.azar}" min="1" step="5" style="width:70px">
           <button class="btn" data-azar>Al azar</button>
           <button class="btn" data-pegar>Pegar lista de artículos</button>
         </span></div>
       <div class="f"><label>&nbsp;</label>
         <span class="inline">
           <button class="btn dan" data-nada>Vaciar selección</button>
         </span></div>
       <div class="f" style="margin-left:auto"><label>Ver</label>
         <select data-ver>${opts(['Todo el universo','Solo seleccionadas'],ST.nv.ver||'Todo el universo')}</select></div>
     </div>
     <div id="nv-t"></div>
   </div>`;

  const filas = (ST.nv.ver==='Solo seleccionadas') ? elegidas : cand;
  UI.tabla(el('nv-t'),{state:ST.nv,rows:filas,
    vacio:'Ninguna existencia cumple estos filtros.',cols:[
    {key:'sel',label:'',w:28,a:'c',sort:false,
      fmt:s=>`<input type="checkbox" data-sel="${s.id}" ${sel.has(s.id)?'checked':''}>`},
    {key:'ub',label:'Ubicación',w:104,cls:()=>'mono'},
    {key:'tipo',label:'Tipo',w:54},
    {key:'sku',label:'SKU',w:96,cls:()=>'mono'},
    {key:'desc',label:'Descripción',val:s=>DB.prod(s.sku).desc,fmt:s=>U.esc(DB.prod(s.sku).desc)},
    {key:'lote',label:'Lote',w:96,cls:()=>'mono'},
    {key:'clase',label:'ABC',w:42,a:'c',val:s=>DB.prod(s.sku).clase,fmt:s=>DB.prod(s.sku).clase},
    {key:'teorico',label:'Existencia',w:82,a:'r',fmt:s=>U.n(s.teorico)},
    {key:'ultConteo',label:'Último conteo',w:104},
    {key:'dias',label:'Días',w:60,a:'r',val:s=>dias(s),
      fmt:s=>{const d=dias(s), lim=CFG.frecuencia[DB.prod(s.sku).clase];
        return `<span class="${d>lim?'neg':''}">${U.n(d)}</span>`;}}
  ]});

  /* --- Interacción ---------------------------------------------------- */
  bindFiltros(ST.nv,{'[data-q]':'q','[data-z]':'zona','[data-cl]':'clase','[data-tu]':'tipo','[data-dias]':'dias'});
  el('view').querySelectorAll('[data-cab]').forEach(i=>{
    const ev=(i.tagName==='INPUT'&&i.type==='text')?'input':'change';
    i.addEventListener(ev,()=>{ cab[i.dataset.cab]=i.value; });
  });
  el('view').querySelectorAll('[data-sel]').forEach(ch=>ch.onchange=()=>{
    const id=+ch.dataset.sel;
    ch.checked?sel.add(id):sel.delete(id);
    ch.closest('tr').classList.toggle('sel',ch.checked);
    ST.nv.render();
  });
  el('view').querySelector('[data-ver]').onchange=e=>{ ST.nv.ver=e.target.value; ST.nv.pag=1; ST.nv.render(); };
  el('view').querySelector('[data-todo]').onclick=()=>{
    if(!cand.length) return UI.msg('No hay líneas que cumplan el filtro','warn');
    cand.forEach(s=>sel.add(s.id));
    UI.msg(U.n(cand.length)+' línea(s) agregadas','ok'); ST.nv.render();
  };
  el('view').querySelector('[data-nada]').onclick=()=>{ sel.clear(); ST.nv.render(); };
  el('view').querySelector('[data-azar]').onclick=()=>{
    const n=+el('view').querySelector('[data-n]').value||0;
    ST.nv.azar=n;
    /* Sorteo real, distinto cada día: mezcla y toma las primeras n */
    const pool=cand.filter(s=>!sel.has(s.id));
    if(!pool.length) return UI.msg('No quedan líneas disponibles con este filtro','warn');
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    const tomadas=pool.slice(0,n);
    tomadas.forEach(s=>sel.add(s.id));
    UI.msg(tomadas.length+' línea(s) tomadas al azar'+(tomadas.length<n?' (era todo lo disponible)':''),'ok');
    ST.nv.render();
  };
  el('view').querySelector('[data-pegar]').onclick=()=>{
    UI.modal('Pegar lista de artículos o ubicaciones',
      `<p class="muted">Un código por línea. Se aceptan SKU y ubicaciones; se agregan todas
       las existencias que coincidan, respetando los filtros de arriba.</p>
       <textarea rows="9" style="width:100%" data-lista
         placeholder="ARZ-1005&#10;ACE-1032&#10;B-04-2-3"></textarea>`,
      [{txt:'Cancelar'},{txt:'Agregar a la selección',cls:'pri',fn:host=>{
        const codigos=host.querySelector('[data-lista]').value.split(/[\n,;]+/)
          .map(x=>x.trim().toUpperCase()).filter(Boolean);
        if(!codigos.length){ UI.msg('No se pegó ningún código','err'); return false; }
        let n=0; const sin=[];
        codigos.forEach(cod=>{
          const hit=cand.filter(s=>s.sku.toUpperCase()===cod||s.ub.toUpperCase()===cod);
          if(!hit.length){ sin.push(cod); return; }
          hit.forEach(s=>{ if(!sel.has(s.id)){ sel.add(s.id); n++; } });
        });
        UI.msg(n+' línea(s) agregadas'+(sin.length?' · '+sin.length+' código(s) sin coincidencia':''),
          sin.length?'warn':'ok');
        if(sin.length) console.warn('Sin coincidencia:',sin);
        ST.nv.render();
      }}]);
  };
  bindEtapas(); UI.bindMas();
  el('view').querySelector('[data-crear]').onclick=()=>{
    if(!elegidas.length) return UI.msg('Seleccione al menos una línea','err');
    const lineas=[...elegidas].sort((a,b)=>U.col.compare(a.ub,b.ub)||U.col.compare(a.sku,b.sku))
      .map(s=>{ const p=DB.prod(s.sku);
        return {stockId:s.id,ub:s.ub,sku:s.sku,desc:p.desc,um:p.um,clase:p.clase,costo:p.costo,
          lote:s.lote,vence:s.vence,teorico:s.teorico,fisico:null,
          /* costo y tolerancia se congelan aqui */
          tol:U.tol(p.clase,s.teorico),
          cerrada:false,decision:'',disc:null};});
    const c={id:U.id('CT',++DB.seq.conteo),tipo:cab.tipo,
      zona: zonasSel.length===1?zonasSel[0]:'Mixta', estado:'ABIERTO',
      criterio: cab.criterio || `Selección manual · ${skus} SKU · zona ${zonasSel.join('/')}`,
      responsable:cab.resp||CFG.usuario, fechaPlan:cab.fecha, fechaEjec:null, fechaCierre:null, lineas};
    if(cab.resp && !CFG.responsables.includes(cab.resp)) CFG.responsables.push(cab.resp);
    DB.conteos.unshift(c);
    DB.log('Conteos','Crear conteo',`${c.id} · ${lineas.length} línea(s) · ${skus} SKU · ${c.criterio}`);
    UI.msg('Conteo '+c.id+' creado con '+lineas.length+' línea(s)','ok');
    sel.clear(); ST.nv.ver='Todo el universo';
    APP.ir('captura',{id:c.id});
  };
};

/* ---------- 5.4 EL INVENTARIO TERMINADO ---------- */
VIEWS.cierre=(p)=>{
  const c=DB.conteo(p.id);
  if(!c){ APP.ir('reportes'); return; }
  /* Mientras se cuenta no hay nada que revisar: eso es la hoja */
  if(c.estado!=='CERRADO'){ APP.ir('captura',{id:c.id}); return; }
  ST.ci??={ver:false};
  ST.ci.render=()=>VIEWS.cierre(p);

  /* Lo que no exige decision se acepta solo */
  c.lineas.forEach(l=>{
    if(!l.cerrada && ['EXACTO','TOLERADO'].includes(DB.estadoLinea(l))){
      l.cerrada=true;
      l.decision = DB.dif(l)===0 ? 'Sin diferencia' : 'Dentro de tolerancia';
    }
  });

  const misDisc   = DB.discDe(c.id);
  const discAb    = misDisc.filter(d=>d.estado!=='RESUELTA');
  const misConf   = c.lineas.filter(l=>l.confirmada);

  /* ================= EL DETALLE DE LO TERMINADO ====================== */
  {
    const perdida=misDisc.filter(d=>d.estado==='RESUELTA').reduce((a,d)=>a+(d.perdida||0),0)
                 +misConf.reduce((a,l)=>a+(DB.valor(l)<0?Math.abs(DB.valor(l)):0),0);
    el('view').innerHTML=hd('Inventario '+c.id,'Inicio › Resultados › '+ESTATUS(c).k,
      `<button class="btn" data-volver>Volver</button>
       <button class="btn" data-reabrir>${ESTATUS(c).accion}</button>`+
      UI.mas([{txt:'Exportar detalle',fn:()=>ST.ci.exportar()}]))+
    `<div class="resultado ${ESTATUS(c).cls==='a'?'inv':(ESTATUS(c).cls==='r'?'dis':'')}">
       <div class="r-ico">${ESTATUS(c).cls==='g'?'&#10003;':'!'}</div>
       <div class="r-txt">
         <h2><span class="st ${ESTATUS(c).cls}">${ESTATUS(c).k}</span></h2>
         <p>Cerrado el ${c.fechaCierre||c.fechaEjec||'—'} - ${U.n(c.lineas.length)} linea(s) contadas -
            ${U.n(misConf.length)} diferencia(s) confirmadas - ${U.n(discAb.length)} caso(s) sin resolver.</p>
       </div>
     </div>
     <div class="kpis" style="grid-template-columns:repeat(4,1fr)">
       <div class="kpi"><div class="l">Exactitud del conteo</div><div class="v">${U.p(DB.eri(c.lineas))}</div>
         <div class="s">${U.n(c.lineas.length)} linea(s)</div></div>
       <div class="kpi"><div class="l">Diferencias confirmadas</div><div class="v">${U.n(misConf.length)}</div>
         <div class="s">${U.m(misConf.reduce((a,l)=>a+DB.valor(l),0))} neto</div></div>
       <div class="kpi"><div class="l">Discrepancias sin resolver</div>
         <div class="v ${discAb.length?'bad':'ok'}">${U.n(discAb.length)}</div>
         <div class="s">de ${U.n(misDisc.length)} abiertas en total</div></div>
       <div class="kpi"><div class="l">Perdida confirmada</div>
         <div class="v ${perdida?'bad':''}" style="font-size:15px">${U.m(perdida)}</div>
         <div class="s">faltantes confirmados y casos cerrados</div></div>
     </div>
     ${misConf.length?`<div class="panel"><div class="panel-hd">Diferencias confirmadas
        <span class="sp"><select data-causa-todas><option value="">Poner causa a las que no tienen...</option>${
          CFG.causas.map(x=>`<option>${U.esc(x)}</option>`).join('')}</select></span></div><div id="ci-c"></div></div>`:''}
     ${misDisc.length?`<div class="panel"><div class="panel-hd">Discrepancias de este conteo
        <span class="sp muted">Doble clic para abrir el caso</span></div><div id="ci-d"></div></div>`:''}
     <div class="inline" style="margin-bottom:8px">
       <button class="btn-lnk" data-detalle>${ST.ci.ver?'Ocultar':'Ver'} las ${U.n(c.lineas.length)} lineas contadas</button>
     </div>
     ${ST.ci.ver?`<div class="panel"><div class="panel-hd">Detalle del conteo</div><div id="ci-res"></div></div>`:''}`;

    if(misConf.length){
      ST.cic??={sort:'valor',dir:1}; ST.cic.render=()=>VIEWS.cierre(p);
      UI.tabla(el('ci-c'),{cols:colsDifs(false),rows:misConf.map(l=>filaRes(c,l)),state:ST.cic,
        vacio:'Sin diferencias.'});
      bindCausas(el('ci-c'));
      el('view').querySelector('[data-causa-todas]').onchange=e=>{
        const cz=e.target.value; if(!cz) return;
        const ls=misConf.filter(l=>!l.causa);
        if(!ls.length) return UI.msg('Todas ya tienen causa','warn');
        ls.forEach(l=>ponerCausa(c,l,cz));
        UI.msg(ls.length+' linea(s) con causa "'+cz+'"','ok'); ST.ci.render();
      };
    }
    if(misDisc.length){
      ST.cid??={render:()=>VIEWS.cierre(p)}; ST.cid.per??=10;
      UI.tabla(el('ci-d'),{cols:colsDisc(),rows:misDisc,state:ST.cid,
        onRow:d=>APP.ir('discrepancia',{id:d.id})});
    }
    if(ST.ci.ver) UI.tabla(el('ci-res'),{state:ST.ci,rows:c.lineas,vacio:'Sin lineas.',cols:[
      {key:'ub',label:'Ubicación',w:104,cls:()=>'mono'},
      {key:'sku',label:'SKU',w:96,cls:()=>'mono'},
      {key:'desc',label:'Descripción'},
      {key:'lote',label:'Lote',w:96,cls:()=>'mono'},
      {key:'teorico',label:'Sistema',w:74,a:'r',fmt:l=>U.n(l.teorico)},
      {key:'fis',label:'Contado',w:74,a:'r',val:l=>DB.fis(l),fmt:l=>U.n(DB.fis(l))},
      {key:'dif',label:'Dif.',w:66,a:'r',val:l=>DB.dif(l),fmt:l=>UI.num(DB.dif(l))},
      {key:'valor',label:'Valor',w:112,a:'r',val:l=>DB.valor(l),fmt:l=>U.m(DB.valor(l))},
      {key:'decision',label:'Qué se hizo',w:190,fmt:l=>U.esc(l.decision||'—')},
      {key:'est',label:'Resultado',w:110,val:l=>DB.estadoLinea(l),fmt:l=>UI.st(DB.estadoLinea(l))}
    ]});
    el('view').querySelector('[data-detalle]').onclick=()=>{ ST.ci.ver=!ST.ci.ver; ST.ci.render(); };
  }

  /* Comunes */
  ST.ci.exportar=()=>U.csv('conteo_'+c.id,[
    {key:'ub',label:'Ubicación'},{key:'sku',label:'SKU'},{key:'desc',label:'Descripción'},
    {key:'lote',label:'Lote'},{key:'teorico',label:'Sistema'},
    {key:'fis',label:'Contado',raw:l=>DB.fis(l)??''},{key:'dif',label:'Diferencia',raw:l=>DB.dif(l)},
    {key:'valor',label:'Valor',raw:l=>DB.valor(l)},{key:'decision',label:'Qué se hizo'},
    {key:'est',label:'Resultado',raw:l=>DB.estadoLinea(l)}],c.lineas);
  /* Volver = a la lista donde vive ese inventario ahora mismo, tal como estaba, por si quiere cambiar otra cosa. */
  el('view').querySelectorAll('[data-volver]').forEach(b=>b.onclick=()=>
    enConteo(c)?APP.ir('inventario',{etapa:'Contar'}):APP.ir('reportes'));
  const bra=el('view').querySelector('[data-reabrir]');
  if(bra) bra.onclick=()=>ACC.volverAConteo(c);
  UI.bindMas();
};

   Una sola pantalla: buscador arriba, cuatro numeros y tres pestanas
   (Inventarios, Diferencias, Casos). Escribir en el buscador reemplaza la pestana
   por las lineas que coinciden, de todos los inventarios terminados. */
const TABS_RES=['Inventarios','Diferencias','Casos'];
ST.res={tab:'Inventarios',per:'Todo',q:'',exp:null};
const fechaCon=c=>c.fechaCierre||c.fechaEjec||'';
const enPeriodo=f=>{
  if(ST.res.per==='Todo') return true;
  const r=rangoDe(ST.res.per,'',''); return !!f && f>=r.a && f<=r.b;
};
const conteosRes=()=>DB.conteos.filter(c=>enReportes(c)&&enPeriodo(fechaCon(c)));
const lineasRes=()=>conteosRes().flatMap(c=>c.lineas.map(l=>({c,l})));
/* Una linea contada, lista para mostrar */
const filaRes=(c,l)=>({conteo:c.id,fecha:fechaCon(c),ub:l.ub,sku:l.sku,desc:l.desc,lote:l.lote,
  teorico:l.teorico,fisico:DB.fis(l),dif:DB.dif(l),valor:DB.valor(l),est:DB.estadoLinea(l),
  causa:l.causa||'',conf:!!l.confirmada,stockId:l.stockId,caso:l.disc||'',
  detalle:l.disc?('Caso '+l.disc):(l.confirmada?(l.causa||'Sin causa'):(l.decision||''))});

/* La causa se escribe aqui, ya con el conteo cerrado: contando no se ve la diferencia */
const selectCausa=r=>`<select class="cau" data-c="${r.conteo}" data-id="${r.stockId}">
    <option value="">(sin causa)</option>
    ${CFG.causas.map(x=>`<option ${r.causa===x?'selected':''}>${U.esc(x)}</option>`).join('')}
  </select>`;
const ponerCausa=(c,l,causa)=>{
  l.causa=causa;
  if(l.confirmada) l.decision='Diferencia confirmada'+(causa?' - '+causa:' - sin causa declarada');
  DB.log('Conteos','Causa de diferencia',`${c.id} - ${l.sku} - ${causa||'sin causa'}`);
  DB.guardar();
};
const bindCausas=host=>host.addEventListener('change',e=>{
  const t=e.target; if(!(t.classList&&t.classList.contains('cau'))) return;
  const c=DB.conteo(t.dataset.c), l=c&&c.lineas.find(x=>x.stockId==t.dataset.id);
  if(l) ponerCausa(c,l,t.value);
});

/* ---------- 5.7 PERIODOS ---------- */
const PERIODOS=['Todo','Hoy','Ayer','Esta semana','Ultimos 7 dias','Este mes',
                'Mes pasado','Ultimos 30 dias','Rango'];
/* Fechas en local, sin pasar por UTC: toISOString corre el dia */
const isoDe=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+
               String(d.getDate()).padStart(2,'0');
const rangoDe=(per,d1,d2)=>{
  const hoy=U.hoy(), d=new Date(hoy+'T00:00:00');
  const menos=n=>{ const y=new Date(d); y.setDate(y.getDate()-n); return isoDe(y); };
  switch(per){
    case 'Hoy':             return {a:hoy,b:hoy};
    case 'Ayer':            return {a:menos(1),b:menos(1)};
    case 'Esta semana':     return {a:menos((d.getDay()+6)%7),b:hoy};   /* arranca lunes */
    case 'Ultimos 7 dias':  return {a:menos(6),b:hoy};
    case 'Este mes':        return {a:hoy.slice(0,8)+'01',b:hoy};
    case 'Mes pasado':      return {a:isoDe(new Date(d.getFullYear(),d.getMonth()-1,1)),
                                    b:isoDe(new Date(d.getFullYear(),d.getMonth(),0))};
    case 'Ultimos 30 dias': return {a:menos(29),b:hoy};
    case 'Rango':           return {a:d1||'0000-01-01',b:d2||hoy};
    default:                return {a:'0000-01-01',b:'9999-12-31'};
  }
};

/* Motivo del inventario */
const MOTIVOS=c=>{
  const g={};
  (c.lineas||[]).filter(l=>l.confirmada&&l.causa).forEach(l=>{
    (g[l.causa]??={n:0,v:0}); g[l.causa].n++; g[l.causa].v+=Math.abs(DB.valor(l)); });
  DB.discDe(c.id).filter(d=>d.causa).forEach(d=>{
    (g[d.causa]??={n:0,v:0}); g[d.causa].n++; g[d.causa].v+=Math.abs(d.valor||0); });
  return Object.keys(g).map(k=>({k,n:g[k].n,v:g[k].v})).sort((a,b)=>b.v-a.v||b.n-a.n);
};
const MOTIVO_TXT=c=>{ const m=MOTIVOS(c); return m.length? m.map(x=>x.k+' ('+x.n+')').join(' · ') : ''; };

  if(t==='Ubicaciones'){
    const lineasDe=cod=>DB.stock.filter(s=>s.ub===cod);
    const rows=DB.ubicaciones.filter(u=>!q||(u.cod+' '+u.zona+' '+u.tipo).toLowerCase().includes(q));
    const cols=[
      {key:'cod',label:'Ubicación',w:120,cls:()=>'mono'},
      {key:'zona',label:'Zona',w:60,a:'c'},
      {key:'tipo',label:'Tipo',w:70},
      {key:'pasillo',label:'Pasillo',w:70,a:'r',fmt:u=>u.pasillo||'—'},
      {key:'rack',label:'Rack',w:60,a:'r',fmt:u=>u.rack||'—'},
      {key:'nivel',label:'Nivel',w:60,a:'r',fmt:u=>u.nivel||'—'},
      {key:'cap',label:'Capacidad',w:90,a:'r',fmt:u=>u.cap?U.n(u.cap):'—'},
      {key:'ocup',label:'Líneas',w:70,a:'r',val:u=>lineasDe(u.cod).length,fmt:u=>U.n(lineasDe(u.cod).length)},
      {key:'cant',label:'Cantidad',w:90,a:'r',val:u=>lineasDe(u.cod).reduce((a,s)=>a+s.teorico,0),
        fmt:u=>U.n(lineasDe(u.cod).reduce((a,s)=>a+s.teorico,0))},
      {key:'acc',label:'',w:126,sort:false,a:'c',
        fmt:u=>`<button class="btn xs" data-edit="${u.cod}">Editar</button>
                <button class="btn xs" data-entrada="${u.cod}">Entrada</button>`}
    ];
    UI.tabla(el('ma-t'),{cols,rows,state:ST.ma,vacio:'Sin ubicaciones registradas.',
      onRow:u=>ACC.formUbicacion(u)});
    ST.ma.exportar=()=>U.csv('ubicaciones',cols.slice(0,-1),rows);
    el('view').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>
      ACC.formUbicacion(DB.ubicaciones.find(u=>u.cod===b.dataset.edit)));
    el('view').querySelectorAll('[data-entrada]').forEach(b=>b.onclick=()=>
      ACC.formEntrada({ub:b.dataset.entrada}));
  }

  /* --- Existencias ---------------------------------------------------- */
  if(t==='Existencias'){
    const rows=DB.stock.filter(s=>!q||
      (s.ub+' '+s.sku+' '+s.lote+' '+DB.prod(s.sku).desc).toLowerCase().includes(q));
    const cols=[
      {key:'ub',label:'Ubicación',w:110,cls:()=>'mono'},
      {key:'tipo',label:'Tipo',w:60},
      {key:'sku',label:'SKU',w:104,cls:()=>'mono'},
      {key:'desc',label:'Descripción',val:s=>DB.prod(s.sku).desc,fmt:s=>U.esc(DB.prod(s.sku).desc)},
      {key:'lote',label:'Lote',w:104,cls:()=>'mono'},
      {key:'vence',label:'Vence',w:88,cls:s=>s.vence&&s.vence<U.hoy()?'neg':'',fmt:s=>s.vence||'—'},
      {key:'teorico',label:'Cantidad',w:88,a:'r',fmt:s=>U.n(s.teorico)},
      {key:'valor',label:'Valor',w:118,a:'r',val:s=>s.teorico*DB.prod(s.sku).costo,
        fmt:s=>U.m(s.teorico*DB.prod(s.sku).costo)},
      {key:'ultConteo',label:'Último conteo',w:104},
      {key:'acc',label:'',w:186,sort:false,a:'c',
        fmt:s=>`<button class="btn xs" data-mov="${s.id}">Entrada / salida</button>
                <button class="btn xs" data-edit="${s.id}">Editar</button>
                <button class="btn xs dan" data-del="${s.id}">Eliminar</button>`}
    ];
    UI.tabla(el('ma-t'),{cols,rows,state:ST.ma,
      vacio:'Sin existencias. Use "Nueva entrada" para registrar la primera.'});
    ST.ma.exportar=()=>U.csv('existencias',cols.slice(0,-1),rows);
    el('view').querySelectorAll('[data-mov]').forEach(b=>b.onclick=()=>{
      const s=DB.stock.find(x=>x.id==b.dataset.mov);
      ACC.formEntrada({ub:s.ub,sku:s.sku,lote:s.lote,vence:s.vence});
    });
    el('view').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>
      ACC.formExistencia(DB.stock.find(x=>x.id==b.dataset.edit)));
    el('view').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>
      ACC.borrarExistencia(DB.stock.find(x=>x.id==b.dataset.del)));
  }

  bindFiltros(ST.ma,{'[data-q]':'q'});
  el('view').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    ST.ma.tab=b.dataset.tab; ST.ma.pag=1; ST.ma.sort=null; ST.ma.render();
  });
  el('view').querySelector('[data-volver]').onclick=()=>APP.ir('configuracion');
  el('view').querySelector('[data-nuevo]').onclick=()=>{
    if(t==='Artículos')   return ACC.formArticulo();
    if(t==='Ubicaciones') return ACC.formUbicacion();
    ACC.formEntrada();
  };
  UI.bindMas();
};

        </div>
        <div class="hr"></div>
        <div class="inline">
          <button class="btn pri" data-maestros>Abrir artículos y existencias</button>

        <label class="inline"><input type="checkbox" data-auto ${DB.autoguardar?'checked':''}>

        <div class="muted" style="margin-top:4px">Apagado de fábrica: la app abre siempre en blanco.

          <button class="btn pri" data-importar>Revisar y cargar</button>

        (ubicacion, sku, descripcion, um, clase, costo, lote, vence, cantidad y sus variantes).

  <details class="panel" id="zona-borrar">
    <summary class="panel-hd" style="cursor:pointer">Borrar datos</summary>
    <div class="panel-bd">
      <div class="muted">Estas acciones no se pueden deshacer. Piden escribir la palabra BORRAR para continuar.</div>
      <div class="inline" style="margin-top:8px">
        <button class="btn dan" data-wipe-mov>Borrar conteos y discrepancias</button>
        <button class="btn dan" data-wipe-all>Borrar todo, incluidos los maestros</button>

    </div>

  el('view').querySelector('[data-save]').onclick=()=>{
    el('view').querySelectorAll('[data-c]').forEach(i=>{
      CFG[i.dataset.c]= i.type==='number' ? +i.value : i.value;
    });
    el('view').querySelectorAll('[data-tol]').forEach(i=>{
      const [k,p]=i.dataset.tol.split('.'); CFG.tolerancia[k][p]=+i.value;
    });
    el('view').querySelectorAll('[data-frec]').forEach(i=>CFG.frecuencia[i.dataset.frec]=+i.value);
    el('view').querySelectorAll('[data-l]').forEach(t=>{
      CFG[t.dataset.l]=t.value.split(t.tagName==='TEXTAREA'?'\n':',').map(x=>x.trim()).filter(Boolean);
    });
    DB.log('Configuración','Guardar parámetros',
      `Meta ${CFG.metaExactitud}% - tolerancia A/B/C ${CFG.tolerancia.A.pct}/${CFG.tolerancia.B.pct}/${CFG.tolerancia.C.pct}%`);
    UI.msg('Configuración guardada. Las reglas se aplican de inmediato.','ok');
    APP.pintarNav(); APP.pintarHeader(); VIEWS.configuracion();
  };
  el('view').querySelector('[data-rest]').onclick=()=>VIEWS.configuracion();

  /* --- Datos del sistema ---------------------------------------------- */
  const recargar=()=>{ APP.pintarHeader(); APP.pintarNav(); VIEWS.configuracion(); };
  el('view').querySelector('[data-maestros]').onclick=()=>APP.ir('maestros');
  /* Borrar pide escribir la palabra: un clic suelto no alcanza */
  const borrarEscribiendo=(titulo,texto,fn)=>UI.modal(titulo,
    `<p>${U.esc(texto)}</p><p class="muted" style="margin-top:8px">Escriba <b>BORRAR</b> para continuar:</p>
     <input type="text" data-conf style="width:100%" autocomplete="off">`,
    [{txt:'Cancelar'},{txt:'Borrar',cls:'dan',fn:host=>{
      if(host.querySelector('[data-conf]').value.trim().toUpperCase()!=='BORRAR'){
        UI.msg('Escriba BORRAR para continuar','err'); return false; }
      fn(); }}]);
  el('view').querySelector('[data-wipe-mov]').onclick=()=>borrarEscribiendo('Borrar conteos y discrepancias',
    'Se eliminan todos los conteos, discrepancias, ajustes e historial. Los productos, ubicaciones y existencias se mantienen.',
    ()=>{ DB.limpiar(false); UI.msg('Conteos, ajustes e historial eliminados','ok'); recargar(); });
  el('view').querySelector('[data-wipe-all]').onclick=()=>borrarEscribiendo('Borrar todo',
    'Se elimina absolutamente todo: productos, ubicaciones, existencias, conteos, ajustes e historial.',
    ()=>{ DB.limpiar(true); UI.msg('Base vacía. Cargue sus existencias para empezar','ok'); recargar(); });
  el('view').querySelector('[data-hist]').onclick=()=>APP.ir('historial');
  const ca=el('view').querySelector('[data-auto]');
  if(ca) ca.onchange=()=>{ DB.prender(ca.checked);
    if(ca.checked){ DB.guardar(true); UI.msg('Ahora se guarda en este navegador','ok'); }
    else UI.msg('Guardado apagado y copia borrada. La app abrira en blanco','ok'); };
  el('view').querySelector('[data-plantilla]').onclick=()=>{
    const b=new Blob(['\ufeff'+DB.plantillaCSV()],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b);
    a.download='plantilla_existencias.csv'; a.click(); URL.revokeObjectURL(a.href);
    UI.msg('Plantilla descargada','ok');
  };
  let csvPendiente='';
  const ta=el('view').querySelector('[data-pegar]');
  /* Excel (.xlsx) o CSV: se lee directo, sin convertir nada, y se abre la revision (no se carga nada hasta confirmar) */
  const tomarArchivo=f=>{
    if(!f) return;
    U.textoDeArchivo(f).then(t=>{
      csvPendiente=t; ta.value='';
      UI.msg('Archivo leído: '+f.name,'ok');
      el('view').querySelector('[data-importar]').click();
    }).catch(e=>UI.msg(e.message||'No se pudo leer el archivo','err'));
  };
  el('view').querySelector('[data-file]').onchange=e=>{ tomarArchivo(e.target.files&&e.target.files[0]); e.target.value=''; };
  ta.addEventListener('input',()=>{ csvPendiente=''; });
  /* Arrastrar el archivo encima del cuadro tambien vale */
  ['dragover','drop'].forEach(ev=>ta.addEventListener(ev,e=>{
    e.preventDefault();
    if(ev==='drop') tomarArchivo(e.dataTransfer.files[0]);
  }));
  el('view').querySelector('[data-importar]').onclick=()=>{
    const texto=csvPendiente||ta.value;
    if(!texto.trim()) return UI.msg('Pegue las celdas o elija un archivo','err');
    const r=DB.leer(texto);
    if(!r.datos.length) return UI.modal('No se pudo leer',
      `<div class="hint">No salio ninguna linea aprovechable. Revise que cada fila traiga al menos
       la ubicacion y el codigo del articulo.</div>
       ${r.errores.length?`<div class="dl"><dt>Primeros avisos</dt><dd>${
         U.esc(r.errores.slice(0,5).join(' · '))}</dd></div>`:''}`,[{txt:'Entendido'}]);

    const reemplazar=el('view').querySelector('[data-reemplazar]').checked;
    const nombres={ub:'Ubicacion',tipo:'Tipo',sku:'Articulo',desc:'Descripcion',um:'Unidad',
      clase:'Clase',costo:'Costo',lote:'Lote',vence:'Vence',cant:'Cantidad'};
    const ix=new Set(DB.stock.map(x=>x.ub+'|'+x.sku+'|'+x.lote));
    const nuevos=r.datos.filter(d=>!ix.has(d.ub+'|'+d.sku+'|'+d.lote)).length;
    const cab=['ub','sku','desc','lote','cant'];
    /* Vista previa: se ve lo que entendio ANTES de tocar nada */
    UI.modal('Revisar la carga',
      `<div class="dl">
         <dt>Se leyeron</dt><dd>${U.n(r.datos.length)} linea(s), separadas por ${r.sep}</dd>
         <dt>Columnas reconocidas</dt><dd>${r.reconocidas.map(k=>nombres[k]).join(' · ')}</dd>
         <dt>Resultado</dt><dd>${U.n(nuevos)} nueva(s), ${U.n(r.datos.length-nuevos)} que actualizan
           una existencia que ya esta</dd>
         ${r.errores.length?`<dt class="neg">Filas descartadas</dt><dd class="neg">${U.n(r.errores.length)} - ${
           U.esc(r.errores.slice(0,3).join(' · '))}${r.errores.length>3?' ...':''}</dd>`:''}
       </div>
       <div class="muted" style="margin:6px 0 2px">Asi quedan las primeras filas:</div>
       <div class="tbl-wrap"><table class="t"><thead><tr>${
         cab.map(k=>`<th>${nombres[k]}</th>`).join('')}</tr></thead><tbody>${
         r.datos.slice(0,5).map(d=>`<tr>${cab.map(k=>
           `<td class="${k==='cant'?'r':''}">${U.esc(d[k])}</td>`).join('')}</tr>`).join('')
       }</tbody></table></div>
       ${reemplazar?`<div class="hint neg">Marco "Reemplazar todo": se borran las existencias,
         conteos y casos que hay ahora mismo.</div>`:''}`,
      [{txt:'Cancelar'},{txt:'Cargar',cls:'pri',fn:()=>{
        if(reemplazar){ DB.stock=[]; DB.conteos=[]; DB.discrepancias=[]; DB.seq={conteo:0,disc:0}; }
        const a=DB.aplicar(r.datos);
        UI.msg(`${U.n(a.alta)} existencia(s) nuevas y ${U.n(a.upd)} actualizada(s)`,'ok');
        ta.value=''; csvPendiente='';
        recargar();
      }}]);
  };
  if(p&&p.foco==='cargar'){ const f=el('cargar-exist'); if(f){ f.scrollIntoView({block:'start'}); ta.focus(); } }
};

    {key:'accion',label:'Acción',w:180},

/* ==========  6. ACCIONES TRANSVERSALES ================================= */
const ACC={
  /* Punto único de entrada: el armador de conteos */
  nuevoConteo(){ APP.ir('nuevo'); },

  /* --- Alta y edición de maestros ------------------------------------ Todo lo que se crea aquí queda registrado en Historial, igual que un movimiento de */

  /* Listas de ayuda para escribir rápido sin memorizar códigos */
  _listas(){
    return `<datalist id="dl-sku">${DB.productos.slice(0,800).map(p=>
        `<option value="${U.esc(p.sku)}">${U.esc(p.desc)}</option>`).join('')}</datalist>
      <datalist id="dl-ub">${DB.ubicaciones.slice(0,800).map(u=>
        `<option value="${U.esc(u.cod)}">`).join('')}</datalist>`;
  },

  formArticulo(p){
    const nuevo=!p;

        const g=s=>host.querySelector(s).value.trim();
        const ub=g('[data-ub]').toUpperCase(), sku=g('[data-sku]').toUpperCase();
        const lote=g('[data-lote]').toUpperCase()||'SIN LOTE';
        const cant=Math.round(+g('[data-cant]'));
        if(!ub||!sku){ UI.msg('Ubicación y artículo son obligatorios','err'); return false; }
        if(!cant){ UI.msg('Indique una cantidad distinta de cero','err'); return false; }
        if(!DB.productos.some(p=>p.sku===sku)){
          UI.msg('El artículo '+sku+' no existe. Créelo primero en la pestaña Artículos','err'); return false; }
        let u=DB.ubicaciones.find(x=>x.cod===ub);
        if(!u){
          u={cod:ub,zona:ub.split('-')[0],tipo:/-PI-/.test(ub)?'PISO':'RACK',pasillo:0,rack:0,nivel:0,cap:0};
          DB.ubicaciones.push(u);
          if(!CFG.zonas.includes(u.zona)) CFG.zonas.push(u.zona);
          DB.log('Maestros','Alta de ubicación',`${ub} · creada al registrar una entrada`);
        }
        let s=DB.stockDe(ub,sku,lote), creada=false;
        if(s){
          if(s.teorico+cant<0){ UI.msg('La salida deja la existencia en negativo','err'); return false; }
          s.teorico+=cant;
          if(g('[data-vence]')) s.vence=g('[data-vence]');
        } else {
          if(cant<0){ UI.msg('No existe esa línea: no se puede registrar una salida','err'); return false; }
          s={id:DB.stock.reduce((m,x)=>Math.max(m,x.id),0)+1,ub,zona:u.zona,tipo:u.tipo,sku,lote,
             vence:g('[data-vence]')||'',teorico:cant,ultConteo:U.hoy()};
          DB.stock.push(s); creada=true;
        }
        DB.indexar();
        DB.log('Maestros',cant>0?'Entrada de existencia':'Salida de existencia',
          `${ub} · ${sku} · lote ${lote} · ${cant>0?'+':''}${U.n(cant)} · saldo ${U.n(s.teorico)}`+
          (g('[data-nota]')?' · '+g('[data-nota]'):'')+(creada?' · línea nueva':''));
        UI.msg(`${cant>0?'Entrada':'Salida'} registrada · ${sku} en ${ub} · saldo ${U.n(s.teorico)}`,'ok');
        if(ST.ma) ST.ma.render();
      }}]);

  /* --- Reglas de resolucion de diferencias ---------------------------- Tres salidas y nada mas. */

  /* SALIDA 2 - Investigar: nace una discrepancia con vida propia */
  investigarLineas(c,ls,causa,st,confirmar,silencio){
    const tot=ls.reduce((a,l)=>a+DB.valor(l),0);
    const hacer=()=>{
      ls.forEach(l=>{
        const d={id:U.id('DC',++DB.seq.disc),conteo:c.id,fecha:U.hoy(),
          ub:l.ub,sku:l.sku,desc:l.desc,lote:l.lote,clase:l.clase,costo:l.costo,
          teorico:l.teorico,fisico:DB.fis(l),dif:DB.dif(l),valor:DB.valor(l),
          estado:'ABIERTA',responsable:'',compromiso:'',
          causa:causa&&causa.get(l.stockId)||'',resuelvePor:'',fechaResuelta:'',
          ajustado:false,perdida:0,notas:[]};
        ACC._nota(d,'Caso abierto desde el conteo '+c.id+
          ' - sistema '+U.n(l.teorico)+', contado '+U.n(DB.fis(l))+
          ' ('+(DB.dif(l)>0?'+':'')+U.n(DB.dif(l))+')');
        DB.discrepancias.unshift(d);
        l.cerrada=true; l.decision='En investigacion - '+d.id; l.disc=d.id;
        if(st&&st.sel) st.sel.delete(l.stockId);
      });
      DB.log('Discrepancias','Abrir investigacion',
        `${c.id} - ${ls.length} caso(s) - ${U.m(tot)} en juego`);
      if(!silencio){
        UI.msg(ls.length+' caso(s) abiertos. El conteo queda senalado hasta que se resuelvan','warn');
        st.render();
      }
    };
    if(confirmar) UI.confirmar('Enviar a investigacion',
      `${ls.length} linea(s) - ${U.m(tot)} en juego. El sistema NO se toca: el caso queda abierto `+
      `hasta que alguien lo resuelva. Continuar?`,hacer);
    else hacer();
  },

  /* Terminar */
  terminar(c){
    const a=DB.avance(c), sinContar=a.t-a.h;
    /* Solo lo que sigue sin resolver */
    const dif=c.lineas.filter(l=>DB.estadoLinea(l)==='DIFERENCIA'&&!l.cerrada);
    const cuadran=c.lineas.filter(l=>DB.fis(l)!=null&&DB.estadoLinea(l)!=='DIFERENCIA').length;
    const valorDif=dif.reduce((x,l)=>x+DB.valor(l),0);

    /* Lo que es igual en las dos salidas: las lineas que no exigen decision */
    const asentarBase=()=>{
      c.lineas.forEach(l=>{
        if(l.cerrada) return;
        if(DB.fis(l)==null){ l.sinContar=true; l.cerrada=true;
          l.decision='Sin contar, se acepto el sistema'; return; }
        const est=DB.estadoLinea(l);
        if(est==='EXACTO'){   l.cerrada=true; l.decision='Sin diferencia'; return; }
        if(est==='TOLERADO'){ l.cerrada=true; l.decision='Dentro de tolerancia'; }
      });
    };
    const sellar=()=>{
      c.estado='CERRADO'; c.fechaCierre=U.hoy(); c.fechaEjec=c.fechaEjec||U.hoy();
      const e=ESTATUS(c);
      DB.log('Conteos','Terminar inventario',
        `${c.id} - exactitud ${U.p(DB.eri(c.lineas))} - ${e.k}`);
      UI.msg(`${c.id} terminado: ${e.k}. Esta en Resultados`,
        e.k===EST_OK?'ok':'warn');
      APP.ir('reportes');
    };

    /* SALIDA A - Cerrar: el conteo vale como esta */
    const cerrar=()=>{
      asentarBase();
      dif.forEach(l=>{ l.cerrada=true; l.confirmada=true;
        l.quien=CFG.usuario; l.cuando=U.hoy();
        l.decision='Diferencia confirmada'+(l.causa?' - '+l.causa:' - sin causa declarada'); });
      sellar();
    };
    /* SALIDA B - Investigar: cada diferencia abre un caso */
    const investigar=()=>{
      asentarBase();
      if(dif.length) ACC.investigarLineas(c,dif,
        new Map(dif.map(l=>[l.stockId,l.causa||''])),null,false,true);
      sellar();
    };

    const btns=[{txt:'Seguir contando'}];
    if(dif.length) btns.push({txt:'Enviar a investigacion',fn:investigar});
    btns.push({txt:dif.length?'Cerrar con diferencias':'Cerrar inventario',cls:'pri',fn:cerrar});

    UI.modal('Terminar el inventario '+c.id,
      `<div class="dl">
         <dt>Contadas</dt><dd>${U.n(a.h)} de ${U.n(a.t)} linea(s)</dd>
         <dt>Cuadraron</dt><dd>${U.n(cuadran)} linea(s), incluyendo las que entran en tolerancia</dd>
         <dt>No cuadraron</dt><dd class="${dif.length?'neg':''}">${U.n(dif.length)} linea(s),
           ${U.m(valorDif)}</dd>
       </div>
       ${sinContar?`<div class="hint">Quedan ${U.n(sinContar)} linea(s) sin contar: se aceptan con la
         cantidad del sistema. Si no era la idea, vuelva y termine de contar.</div>`:''}
       ${dif.length
         ? `<div class="dl" style="margin-top:8px">
              <dt>Cerrar con diferencias</dt><dd>El conteo es real y se da por bueno. Las
                ${U.n(dif.length)} diferencia(s) quedan confirmadas y el inventario se archiva
                <b>CON DIFERENCIAS</b>. La causa se anota despues, en Resultados.</dd>
              <dt>Enviar a investigacion</dt><dd>Se abre un caso por cada diferencia, con
                responsable y bitacora. El inventario queda <b>CON DIFERENCIAS</b> y los casos
                se siguen en la pestana Casos de Resultados.</dd>
            </div>`
         : `<div class="hint">No hay diferencias: el inventario se archiva <b>CUADRÓ</b>.</div>`}
       <div class="hint">En ningun caso se toca la existencia del sistema: la correccion se hace
         en el sistema que manda.</div>`,
      btns);
  },

  /* Ningun estatus es un callejon sin salida. */
  volverAConteo(c){
    if(!c) return;
    const e=ESTATUS(c);
    if(e.modo==='seguir') return APP.ir('captura',{id:c.id});
    const reiniciar = e.modo==='reiniciar';
    const casos = DB.discAbiertas(c.id);
    UI.confirmar(reiniciar?'Reiniciar el conteo':'Reabrir el conteo',
      reiniciar
        ? `${c.id} vuelve a la etapa Contar donde se quedo.`+
          (casos.length?` Las ${U.n(casos.length)} linea(s) en investigacion se dejan en blanco para `+
           `contarlas otra vez; los casos siguen abiertos con su bitacora.`:'')+
          ` Continuar?`
        : `${c.id} vuelve a la etapa Contar tal como quedo. Lo ya decidido se mantiene. Continuar?`,
      ()=>{
        c.estado='ABIERTO'; c.fechaCierre=null;
        if(reiniciar){
          c.lineas.forEach(l=>{
            const enCaso = l.disc && casos.some(d=>d.id===l.disc);
            if(enCaso || l.sinContar){
              l.fisico=null; l.sinContar=false; l.cerrada=false;
              l.decision=''; l.confirmada=false; l.causa='';
            }
          });
          casos.forEach(d=>ACC._nota(d,'El conteo '+c.id+' se reinicio: la linea vuelve a contarse'));
        }
        DB.log('Conteos',reiniciar?'Reiniciar conteo':'Reabrir conteo',
          `${c.id} - vuelve a la etapa Contar`);
        UI.msg(c.id+(reiniciar?' reiniciado':' reabierto')+'. Esta otra vez en Contar','ok');
        APP.ir('captura',{id:c.id});
      });
  },
  /* No hay que guardarlo todo: lo que ya no sirve se borra */
  eliminarReporte(c){
    if(!c) return;
    const casos=DB.discDe(c.id).length;
    UI.confirmar('Eliminar el inventario '+c.id,

         <select data-cz>${opts([''].concat(CFG.causas),'')}</select>
         <label class="lb">Que se comprobo</label>
         <select data-aj>${opts(['La diferencia era real','No habia diferencia: error de conteo'],
           'La diferencia era real')}</select>
         <label class="lb">Hubo perdida</label>
         <select data-pd>${opts(['Si','No'],faltante?'Si':'No')}</select>
         <div class="hint">Valor en juego: ${U.m(tot)}. Aunque el caso quede resuelto, el conteo
          que lo genero conserva la senal de discrepancia. La correccion en el sistema que manda
          se hace aparte: aqui solo queda documentado.</div>
         <label class="lb">Como se resolvio</label>
         <textarea rows="3" data-n placeholder="Explique en dos lineas que paso"></textarea>
       </div>`,
      [{txt:'Cancelar'},{txt:'Resolver caso',cls:'pri',fn:host=>{
        const g=x=>host.querySelector(x).value;
        const cz=g('[data-cz]');
        if(!cz){ UI.msg('Elija la causa comprobada','err'); return false; }
        const real=g('[data-aj]')==='La diferencia era real';
        const hubo=g('[data-pd]')==='Si';
        const nota=host.querySelector('[data-n]').value.trim();
        ls.forEach(d=>{
          d.estado='RESUELTA'; d.causa=cz; d.real=real;
          d.perdida = hubo ? Math.abs(d.valor) : 0;
          d.fechaResuelta=U.hoy(); d.resuelvePor=CFG.usuario;
          ACC._nota(d,'Resuelto - '+cz+' - '+(real?'la diferencia era real':'error de conteo, no habia diferencia')+
            (hubo?' - perdida confirmada '+U.m(Math.abs(d.valor)):' - sin perdida')+
            (nota?' - '+nota:''));
        });
        DB.log('Discrepancias','Resolver caso',
          `${ls.length} caso(s) - ${cz} - ${real?'diferencia real':'error de conteo'}`);
        UI.msg(ls.length+' caso(s) resueltos','ok');
        if(cb) cb();
      }}]);
  }
};

/* ==========  7. HELPERS DE FORMULARIO ================================== */
function opts(lista,sel){
  return lista.map(v=>`<option value="${U.esc(v)}" ${v===sel?'selected':''}>${v===''?'(Todos)':U.esc(v)}</option>`).join('');
}
function bindFiltros(st,mapa){
  Object.entries(mapa).forEach(([sel,key])=>{
    const e=el('view').querySelector(sel); if(!e) return;
    const texto=(e.tagName==='INPUT'&&e.type==='text');
    /* Escribir no puede repintar la tabla en cada tecla */
    const aplicar=()=>{ st.f[key]=e.value; st.pag=1; st.foco=sel; st.render(); };
    e.addEventListener(texto?'input':'change', texto
      ? ()=>{ clearTimeout(st._deb); st._deb=setTimeout(aplicar,260); }
      : aplicar);
  });
  const lim=el('view').querySelector('[data-limpiar]');
  /* Solo se limpian los filtros enlazados */
  if(lim) lim.onclick=()=>{ Object.values(mapa).forEach(k=>st.f[k]=''); st.pag=1; st.render(); };
  if(st.foco){
    const t=el('view').querySelector(st.foco);
    if(t){ t.focus(); if(t.type==='text'&&t.setSelectionRange) t.setSelectionRange(t.value.length,t.value.length); }
    st.foco=null;
  }
}

/* ==========  8. ENRUTADOR Y ARRANQUE =================================== */
const APP={
  menu:[
    {k:'inventario',t:'Inventario'},
    {k:'reportes',t:'Resultados'},
    {k:'configuracion',t:'Configuración'}
  ],
  actual:'inventario',
  /* Un solo numero en el menu: todo lo que esta esperando en la linea */
  pintarNav(){
    el('nav').innerHTML='<div class="nav-sec">Operacion</div>'+
      APP.menu.map((m,i)=>`<a class="nav-i ${APP.actual===m.k?'on':''}" data-k="${m.k}">${m.t}</a>`+
        (i===1?'<div class="nav-sec">Administracion</div>':'')).join('');
    el('nav').querySelectorAll('[data-k]').forEach(a=>a.onclick=()=>APP.ir(a.dataset.k));
  },
  pintarHeader(){
    const v=DB.fotoVieja();
    el('hd-foto').textContent = DB.foto.fecha
      ? DB.foto.fecha+(v>1?' ('+v+' d)':'') : 'sin cargar';
    el('hd-foto').style.color = (v===null||v>1) ? '#ffd9d9' : '';
    el('hd-cd').textContent=CFG.centro;
    el('hd-user').textContent=CFG.usuario+(CFG.rol?' - '+CFG.rol:'');
    el('ft-ver').textContent='SGI v2.0'+(CFG.empresa?' - '+CFG.empresa:'');
    el('hd-sesion').onclick=APP.editarSesion;
    el('hd-exist').onclick=()=>APP.ir('configuracion',{foco:'cargar'});
  },
  editarSesion(){
    UI.modal('Datos de la sesion',
      `<div class="form-grid">
         <label class="lb">Centro</label><input type="text" data-s="centro" value="${U.esc(CFG.centro)}">
         <label class="lb">Usuario</label><input type="text" data-s="usuario" value="${U.esc(CFG.usuario)}">
         <label class="lb">Rol</label><input type="text" data-s="rol" value="${U.esc(CFG.rol)}">
       </div>
       <div class="hint">Es quien firma los conteos y queda en el historial.</div>`,
      [{txt:'Cancelar'},{txt:'Guardar',cls:'pri',fn:()=>{
        document.querySelectorAll('#modal-host [data-s]').forEach(i=>{
          if(i.value.trim()) CFG[i.dataset.s]=i.value.trim(); });
        APP.pintarHeader(); DB.guardar(); UI.msg('Sesion actualizada','ok');
      }}]);
  },
  cerrarMenu(){
    el('nav').classList.remove('abierto');
    el('nav-mask').classList.remove('on');
  },
  /* El boton atras del navegador tiene que moverse dentro de la app, no sacar al usuario del sitio. */
  ir(vista,params,dePopstate){
    APP.cerrarMenu();
    if(VIEWS[vista]){
      if(!dePopstate){
        const est={v:vista,p:params||{}};
        if(APP._ult!==vista+JSON.stringify(params||{})){
          history.pushState(est,'','#'+vista); APP._ult=vista+JSON.stringify(params||{});
        }
      }
      /* Las pantallas de detalle no salen en el menu: se marca la linea */
      APP.actual = ['captura','nuevo','conteos'].includes(vista) ? 'inventario'
        : (['cierre','discrepancias','discrepancia','bandeja'].includes(vista) ? 'reportes'
        : (['maestros','historial'].includes(vista) ? 'configuracion' : vista));
      APP.pintarNav(); APP.pintarHeader();
      VIEWS[vista](params||{});
      el('view').scrollTop=0;
      DB.guardar();
    }
  },
  init(){
    DB.init();
    APP.pintarHeader(); APP.pintarNav(); APP.ir('inventario');
    addEventListener('popstate',e=>{
      const est=e.state||{v:'inventario',p:{}};
      APP._ult=est.v+JSON.stringify(est.p||{});
      APP.ir(est.v,est.p,true);
    });
    /* Al cerrar la pestana se guarda de una vez, sin esperar el retardo */
    addEventListener('beforeunload',()=>DB.guardar(true));
    setInterval(()=>{ el('hd-clock').textContent=U.ts().slice(0,16); },20000);
    el('hd-clock').textContent=U.ts().slice(0,16);
    el('btn-menu').onclick=()=>{
      el('nav').classList.toggle('abierto');
      el('nav-mask').classList.toggle('on');
    };
    el('nav-mask').onclick=APP.cerrarMenu;
    document.addEventListener('click',e=>{
      if(!(e.target.closest&&e.target.closest('.mas')))
        document.querySelectorAll('.mas-lista.on').forEach(l=>l.classList.remove('on'));
    });
    /* Atajos: Alt+1..9 navegacion directa */
    document.addEventListener('keydown',e=>{
      if(e.altKey && e.key>='1' && +e.key<=APP.menu.length){ e.preventDefault();
        const m=APP.menu[+e.key-1]; if(m) APP.ir(m.k); }
      if(e.key==='Escape'){ const m=document.querySelector('.mask'); if(m) m.parentElement.innerHTML=''; APP.cerrarMenu(); }
    });
  }
};
APP.init();
</script>
