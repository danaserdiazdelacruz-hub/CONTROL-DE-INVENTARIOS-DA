<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SGI — Sistema de Gestión de Inventario | Centro de Distribución</title>
<style>
/* =========================================================================
   SGI — Sistema de Gestión de Inventario de Centro de Distribución
   Hoja de estilos corporativa. Densidad alta, sin decoración.
   Referencia visual: SAP Fiori / Oracle WMS / Dynamics 365.
   ========================================================================= */

/* --- 1. Tokens corporativos ------------------------------------------- */
:root{
  --c-bg:#eef0f2;          /* fondo aplicacion  */
  --c-panel:#ffffff;       /* superficie        */
  --c-head:#e9ecef;        /* encabezado tabla  */
  --c-line:#c9ced4;        /* borde fuerte      */
  --c-line-soft:#e3e6e9;   /* borde interno     */
  --c-txt:#1c1f23;         /* texto principal   */
  --c-txt2:#5b6570;        /* texto secundario  */
  --c-blue:#0b4f8f;        /* azul corporativo  */
  --c-blue-d:#083c6d;
  --c-blue-l:#e8eef5;
  --c-red:#b3261e;         /* solo errores      */
  --c-red-l:#fbeceb;
  --c-green:#146c37;       /* solo estado correcto */
  --c-green-l:#eaf3ed;
  --c-amber:#8a6100;       /* solo advertencias */
  --c-amber-l:#fdf5e3;
  --fs:15px;               /* dato: lo que se lee de pie */
  --fs2:13px;              /* secundario */
  --fs3:12px;              /* etiquetas */
  --h-row:34px;            /* fila comoda para dedo */
  --r:2px;                 /* radio minimo */
}

/* --- 2. Base ----------------------------------------------------------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:var(--fs);line-height:1.35;color:var(--c-txt);
  background:var(--c-bg);-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:var(--fs);color:inherit}
a{color:var(--c-blue);text-decoration:none}
::selection{background:var(--c-blue-l)}

/* --- 3. Layout: header / sidebar / main / footer ----------------------- */
#app{display:grid;height:100vh;
  grid-template-columns:208px 1fr;
  grid-template-rows:46px 1fr 30px;
  grid-template-areas:"hd hd" "nav main" "ft ft";}

header{grid-area:hd;background:var(--c-blue);color:#fff;display:flex;align-items:center;
  padding:0 10px;gap:14px;border-bottom:1px solid var(--c-blue-d)}
.brand{font-weight:600;letter-spacing:.4px}
.brand span{font-weight:400;opacity:.85;margin-left:6px}
.hd-ctx{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:var(--fs2);opacity:.95}
.hd-ctx b{font-weight:600}
.hd-sep{width:1px;height:18px;background:rgba(255,255,255,.28)}
.hd-ed{cursor:pointer;border-bottom:1px dotted rgba(255,255,255,.45)}
.hd-ed:hover{color:#fff;border-bottom-color:#fff}

nav{grid-area:nav;background:#f6f7f8;border-right:1px solid var(--c-line);overflow-y:auto}
.nav-sec{padding:8px 10px 4px;font-size:var(--fs3);letter-spacing:.7px;color:var(--c-txt2);text-transform:uppercase}
.nav-i{display:block;padding:5px 10px;border-left:3px solid transparent;color:var(--c-txt);cursor:pointer;white-space:nowrap}
.nav-i:hover{background:#e9ecef}
.nav-i.on{background:var(--c-blue-l);border-left-color:var(--c-blue);font-weight:600;color:var(--c-blue-d)}

main{grid-area:main;overflow:auto;padding:8px}
footer{grid-area:ft;background:#f6f7f8;border-top:1px solid var(--c-line);
  display:flex;align-items:center;padding:0 10px;gap:14px;font-size:var(--fs2);color:var(--c-txt2)}
footer .sp{margin-left:auto}

/* --- 4. Bloques de contenido ------------------------------------------ */
.view-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.view-hd h1{font-size:19px;font-weight:600}
.view-hd .crumb{color:var(--c-txt2);font-size:var(--fs2)}
.view-hd .sp{margin-left:auto;display:flex;gap:5px}

.panel{background:var(--c-panel);border:1px solid var(--c-line);margin-bottom:8px}
.panel-hd{background:var(--c-head);border-bottom:1px solid var(--c-line);padding:4px 8px;
  font-weight:600;font-size:var(--fs2);text-transform:uppercase;letter-spacing:.4px;
  display:flex;align-items:center;gap:8px}
.panel-hd .sp{margin-left:auto;display:flex;gap:5px;align-items:center}
.panel-bd{padding:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:1100px){.grid2,.grid3{grid-template-columns:1fr}}

/* --- 5. Banda de indicadores (tablero de control) --------------------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--c-line);
  background:var(--c-panel);margin-bottom:8px}
@media(max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{padding:6px 9px;border-right:1px solid var(--c-line-soft)}
.kpi:last-child{border-right:0}
.kpi .l{font-size:var(--fs3);text-transform:uppercase;letter-spacing:.5px;color:var(--c-txt2)}
.kpi .v{font-size:23px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .s{font-size:var(--fs3);color:var(--c-txt2);font-variant-numeric:tabular-nums}
.kpi .v.ok{color:var(--c-green)} .kpi .v.bad{color:var(--c-red)} .kpi .v.warn{color:var(--c-amber)}

/* --- 6. Tablas: nucleo del sistema ------------------------------------ */
.tbl-wrap{overflow:auto;border-top:1px solid var(--c-line)}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{background:var(--c-head);text-align:left;font-weight:600;font-size:var(--fs2);
  padding:6px 6px;border-bottom:1px solid var(--c-line);border-right:1px solid var(--c-line-soft);
  position:sticky;top:0;z-index:2;white-space:nowrap;cursor:pointer;user-select:none}
table.t th.nos{cursor:default}
table.t th .ar{color:var(--c-blue);margin-left:3px}
table.t td{padding:3px 6px;border-bottom:1px solid var(--c-line-soft);
  border-right:1px solid var(--c-line-soft);white-space:nowrap;height:var(--h-row)}
table.t tbody tr:hover{background:#f4f6f8}
table.t tbody tr.sel{background:var(--c-blue-l)}
table.t .r{text-align:right} table.t .c{text-align:center}
table.t .mono{font-family:Consolas,"Segoe UI Mono",monospace}
.t-empty{padding:14px;text-align:center;color:var(--c-txt2)}
.neg{color:var(--c-red)} .pos{color:var(--c-green)}

/* --- 7. Barra de filtros ---------------------------------------------- */
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;padding:6px 8px;
  background:#fafbfc;border-bottom:1px solid var(--c-line-soft)}
.f{display:flex;flex-direction:column;gap:2px}
.f label{font-size:var(--fs3);color:var(--c-txt2);text-transform:uppercase;letter-spacing:.4px}
input[type=text],input[type=number],input[type=date],select,textarea{
  height:32px;padding:0 7px;font-size:var(--fs);border:1px solid var(--c-line);border-radius:var(--r);
  background:#fff;outline:none}
textarea{height:auto;padding:4px 5px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--c-blue);box-shadow:inset 0 0 0 1px var(--c-blue)}
input[readonly]{background:#f2f3f5;color:var(--c-txt2)}
select{min-width:110px}
.f input[type=text]{min-width:150px}

/* --- 8. Botones -------------------------------------------------------- */
.btn{height:24px;padding:0 9px;border:1px solid var(--c-line);background:#fbfbfc;
  border-radius:var(--r);cursor:pointer;white-space:nowrap}
.btn:hover{background:#eef0f2}
.btn:active{background:#e2e5e8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--c-blue);border-color:var(--c-blue-d);color:#fff}
.btn.pri:hover{background:var(--c-blue-d)}
.btn.dan{border-color:var(--c-red);color:var(--c-red)}
.btn.dan:hover{background:var(--c-red-l)}
.btn.xs{height:28px;padding:0 9px;font-size:var(--fs2)}
.btn-lnk{background:none;border:0;color:var(--c-blue);cursor:pointer;padding:0;text-decoration:underline}
:focus-visible{outline:2px solid var(--c-blue);outline-offset:1px}

/* --- 9. Estados (semaforo restringido) -------------------------------- */
.st{display:inline-block;padding:0 6px;border:1px solid;border-radius:var(--r);font-size:var(--fs2);line-height:20px}
.st.g{color:var(--c-green);border-color:var(--c-green);background:var(--c-green-l)}
.st.r{color:var(--c-red);border-color:var(--c-red);background:var(--c-red-l)}
.st.a{color:var(--c-amber);border-color:var(--c-amber);background:var(--c-amber-l)}
.st.b{color:var(--c-blue);border-color:var(--c-blue);background:var(--c-blue-l)}
.st.n{color:var(--c-txt2);border-color:var(--c-line);background:#f4f5f6}

/* --- 10. Paginacion ---------------------------------------------------- */
.pag{display:flex;align-items:center;gap:6px;padding:4px 8px;border-top:1px solid var(--c-line);
  background:#fafbfc;font-size:var(--fs2);color:var(--c-txt2)}
.pag .sp{margin-left:auto;display:flex;gap:4px;align-items:center}

/* --- 11. Formularios de configuracion ---------------------------------- */
.form-grid{display:grid;grid-template-columns:210px 1fr;gap:5px 10px;align-items:center}
.form-grid .lb{color:var(--c-txt2);text-align:right}
.form-grid .hint{grid-column:2;font-size:10px;color:var(--c-txt2);margin-top:-3px}
fieldset{border:1px solid var(--c-line-soft);padding:8px;margin-bottom:8px}
legend{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;padding:0 4px;color:var(--c-txt2)}

/* --- 12. Barra de progreso / grafico de barras (sin color fuerte) ------ */
.bar{height:10px;background:var(--c-line-soft);border:1px solid var(--c-line);position:relative}
.bar>i{display:block;height:100%;background:var(--c-blue)}
.bar>i.g{background:var(--c-green)} .bar>i.r{background:var(--c-red)} .bar>i.a{background:var(--c-amber)}
.chart-row{display:grid;grid-template-columns:120px 1fr 62px;gap:6px;align-items:center;margin-bottom:3px}
.chart-row .cl{color:var(--c-txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-row .cv{text-align:right;font-variant-numeric:tabular-nums}

/* --- 13. Dialogo modal (minimo, sin efectos) --------------------------- */
.mask{position:fixed;inset:0;background:rgba(28,31,35,.35);display:flex;
  align-items:flex-start;justify-content:center;padding-top:80px;z-index:50}
.modal{background:var(--c-panel);border:1px solid var(--c-line);width:520px;max-width:94vw}
.modal .panel-hd{justify-content:space-between}
.modal-ft{padding:6px 8px;border-top:1px solid var(--c-line);background:#fafbfc;
  display:flex;gap:5px;justify-content:flex-end}

/* --- 14. Mensajes de estado ------------------------------------------- */
#msg{position:fixed;right:10px;bottom:32px;z-index:60;display:flex;flex-direction:column;gap:4px}
.toast{background:var(--c-panel);border:1px solid var(--c-line);border-left:3px solid var(--c-blue);
  padding:5px 10px;min-width:220px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.toast.err{border-left-color:var(--c-red)} .toast.ok{border-left-color:var(--c-green)}
.toast.warn{border-left-color:var(--c-amber)}

/* --- 15. Utilidades ---------------------------------------------------- */
.muted{color:var(--c-txt2)} .b{font-weight:600} .nowrap{white-space:nowrap}
.dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11px}
.dl dt{color:var(--c-txt2)} .dl dd{font-weight:600}
.inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qty-in{width:70px;text-align:right}
.hr{height:1px;background:var(--c-line-soft);margin:6px 0}

/* --- 16. Hoja de conteo: comportamiento de hoja de cálculo ------------- */
.sheet-bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--c-panel);
  border:1px solid var(--c-line);padding:5px 9px;margin-bottom:8px;position:sticky;top:0;z-index:4}
.sb-item{display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.sb-item .l{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--c-txt2)}
.sb-item b{font-size:13px}
table.hoja input.cap{width:100%;height:20px;padding:0 4px;text-align:right;
  border:1px solid var(--c-line);border-radius:var(--r);background:#fff}
table.hoja input.cap:focus{border-color:var(--c-blue);box-shadow:inset 0 0 0 1px var(--c-blue);background:var(--c-blue-l)}
table.hoja tr.dif td{background:var(--c-red-l)}
table.hoja tr.tol td{background:var(--c-amber-l)}
table.hoja tr.ok  td{background:var(--c-green-l)}
table.hoja tr:hover td{filter:brightness(.985)}
table.hoja td{height:26px}
.pag .st{margin-left:6px}


/* =========================================================================
   17. TABLET Y MÓVIL
   El escritorio manda: la densidad no se toca por encima de 900px porque la
   tablet en horizontal es donde más se trabaja. Por debajo, el sistema
   cambia de forma: menú en cajón, tablas apiladas y controles de dedo.
   ========================================================================= */
#btn-menu{display:none;background:transparent;border:1px solid rgba(255,255,255,.35);
  color:#fff;border-radius:var(--r);width:34px;height:28px;font-size:16px;line-height:1;cursor:pointer}
#nav-mask{display:none}
.mov{display:none}                      /* controles solo de móvil */
.cap-wrap{display:flex;gap:4px;align-items:center}
.cap-wrap input{flex:1}

@media (max-width:900px){
  :root{--fs:13px;--h-row:26px}
  #app{grid-template-columns:1fr;grid-template-areas:"hd" "main" "ft"}
  main{padding:6px}

  /* Menú lateral convertido en cajón */
  #btn-menu{display:block}
  nav{position:fixed;top:40px;bottom:24px;left:0;width:240px;z-index:30;
      transform:translateX(-100%);transition:transform .15s ease;box-shadow:1px 0 4px rgba(0,0,0,.2)}
  nav.abierto{transform:none}
  #nav-mask.on{display:block;position:fixed;inset:46px 0 30px;background:rgba(28,31,35,.4);z-index:29}
  .nav-i{padding:12px 12px}
  .hd-ctx span:not(#hd-clock),.hd-sep{display:none}
  .hd-ctx #hd-sesion{display:inline}
  .hd-ctx #hd-clock{font-size:11px}

  /* Objetivos táctiles */
  .btn{height:40px;padding:0 12px}
  .btn.xs{height:34px;padding:0 10px}
  input[type=text],input[type=number],input[type=date],select{height:40px;font-size:16px}
  textarea{font-size:16px}
  input[type=checkbox]{width:22px;height:22px}
  .mov{display:inline-block}

  /* Indicadores y bloques */
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid3{grid-template-columns:1fr}
  .view-hd{flex-wrap:wrap}
  .view-hd .sp{width:100%;flex-wrap:wrap}
  .view-hd .crumb{display:none}

  /* Filtros en columna, a todo el ancho */
  .filters{flex-direction:column;align-items:stretch}
  .f{width:100%}
  .f input,.f select,.f button,.filters .btn{width:100%}
  .f input[type=text],select{min-width:0}
  .filters .inline{display:grid;grid-template-columns:1fr;gap:5px}
  .filters .inline .btn{width:100%}
  .f[style*="margin-left:auto"]{margin-left:0!important}

  /* Tablas apiladas: cada fila es una ficha con etiqueta y valor */
  table.t thead{display:none}
  table.t,table.t tbody,table.t tr,table.t td{display:block;width:100%}
  table.t tr{border:1px solid var(--c-line);margin-bottom:6px;background:var(--c-panel)}
  table.t tbody tr:hover{background:var(--c-panel)}
  table.t td{border:0;border-bottom:1px solid var(--c-line-soft);white-space:normal;
    height:auto;min-height:30px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  table.t td:last-child{border-bottom:0}
  table.t td::before{content:attr(data-l);color:var(--c-txt2);font-size:11px;
    text-transform:uppercase;letter-spacing:.4px;flex:0 0 42%;text-align:left}
  table.t td[data-l=""]::before,table.t td:not([data-l])::before{content:none}
  table.t td.r,table.t td.c{text-align:left}
  .tbl-wrap{max-height:none!important;border-top:0}

  /* Paginación con el pulgar */
  .pag{flex-wrap:wrap}
  .pag .no-mov{display:none}
  .pag .sp{width:100%;margin-left:0;margin-top:4px}
  .pag .sp .btn{flex:1}

  /* Barra de la hoja de conteo */
  .sheet-bar{gap:8px 14px;padding:6px}
  .sheet-bar .no-mov{display:none}
  .sheet-bar .sb-item{flex:1 1 auto}
  .sheet-bar #scan,.sheet-bar select{width:100%}

  /* Hoja de conteo: ficha por línea con captura grande */
  table.hoja td[data-l="#"],table.hoja td[data-l="UM"],table.hoja td[data-l="Valor"]{display:none}
  table.hoja td[data-l="Ubicación"]{font-size:15px;font-weight:600;background:var(--c-head)}
  table.hoja td[data-l="Contado"]{padding:6px}
  table.hoja input.cap{height:44px;font-size:20px;font-weight:600}
  table.hoja .cap-wrap .btn{height:44px;width:44px;padding:0;font-size:18px}
  table.hoja td[data-l="="] .btn{height:40px;width:100%}
  table.hoja tr{margin-bottom:8px}

  /* Diálogos a pantalla completa */
  .mask{padding-top:0;align-items:stretch}
  .modal{width:100%;max-width:100%;height:100%;display:flex;flex-direction:column}
  .modal .panel-bd{flex:1;overflow:auto}
  .modal-ft .btn{flex:1}

  .form-grid{grid-template-columns:1fr}
  .form-grid .lb{text-align:left}
  .form-grid .hint{grid-column:1}
}

@media (max-width:420px){
  .kpis{grid-template-columns:1fr}
  table.t td::before{flex-basis:38%}
}


/* --- 18. Guía de ciclo de vida y avisos de pestaña -------------------- */
.aviso{background:var(--c-blue-l);border:1px solid var(--c-line);border-left:3px solid var(--c-blue);
  padding:6px 9px;margin-bottom:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.flujo{display:flex;align-items:center;gap:5px;margin-left:auto;flex-wrap:wrap}
.flujo .fl{border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-txt2);
  padding:0 6px;border-radius:var(--r);font-size:10px;letter-spacing:.4px;line-height:17px}
.flujo .fl.on{background:var(--c-blue);border-color:var(--c-blue-d);color:#fff;font-weight:600}
.flujo .fs{color:var(--c-txt2)}
@media (max-width:900px){.aviso{display:block}.flujo{margin-left:0;margin-top:6px}}


/* --- 19. Barra de etapas del proceso y menú de acciones --------------- */
.etapas{display:flex;align-items:stretch;background:var(--c-panel);border:1px solid var(--c-line);
  margin-bottom:8px;overflow-x:auto}
.etapas .et{display:flex;align-items:center;gap:6px;background:transparent;border:0;
  border-right:1px solid var(--c-line-soft);padding:6px 12px;cursor:pointer;white-space:nowrap;
  color:var(--c-txt2);font-size:12px}
.etapas .et:hover{background:#f2f4f6}
.etapas .et.on{background:var(--c-blue);color:#fff;font-weight:600}
.etapas .et .n{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  border:1px solid var(--c-line);border-radius:50%;font-size:10px;background:#fff;color:var(--c-txt2)}
.etapas .et.on .n{background:#fff;color:var(--c-blue-d);border-color:#fff;font-weight:700}
.etapas .et .c{background:var(--c-red);color:#fff;border-radius:9px;padding:0 6px;font-size:var(--fs3);line-height:18px}
.etapas .et.on .c{background:#fff;color:var(--c-blue-d)}
.etapas .es{display:none}
.pista{color:var(--c-txt2);margin:-4px 0 8px;font-size:11px}

.mas{position:relative;display:inline-block}
.mas>[data-mas-btn]{width:28px;padding:0;font-size:15px;line-height:1}
.mas-lista{display:none;position:absolute;right:0;top:26px;z-index:25;min-width:190px;
  background:var(--c-panel);border:1px solid var(--c-line);box-shadow:0 2px 4px rgba(0,0,0,.15)}
.mas-lista.on{display:block}
.mas-lista .btn{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--c-line-soft);
  border-radius:0;height:28px}
.mas-lista .btn:last-child{border-bottom:0}
.flujo .fl.hecha{color:var(--c-green);border-color:var(--c-green);background:var(--c-green-l)}
@media (max-width:900px){
  .etapas .et{padding:10px 10px;flex:1 0 auto}
  .mas-lista .btn{height:40px}
}


/* --- 20. Barra del documento y pantalla de resultado ------------------ */
.etapas.doc{background:#f6f7f8}
.etapas.doc .et-doc{display:flex;align-items:center;padding:6px 12px;font-weight:600;
  background:var(--c-panel);border-right:1px solid var(--c-line);font-family:Consolas,monospace}
.etapas.doc .et{cursor:default}
.etapas.doc .et:hover{background:transparent}
.etapas.doc .et.hecha{color:var(--c-green)}
.etapas.doc .et.hecha .n{background:var(--c-green-l);border-color:var(--c-green);color:var(--c-green)}

.resultado{display:flex;align-items:center;gap:14px;background:var(--c-panel);

.resultado.fin{border-left-color:var(--c-blue)}
.resultado.inv{border-left-color:var(--c-amber)}
.resultado.dis{border-left-color:var(--c-red)}

.resultado.fin .r-ico{background:var(--c-blue-l);color:var(--c-blue)}
.resultado.inv .r-ico{background:var(--c-amber-l);color:var(--c-amber)}

.resultado .r-txt h2{font-size:15px;font-weight:600;margin-bottom:2px}

  .resultado{display:block}
  .resultado .r-ico{margin-bottom:8px}
  .resultado .r-acc{margin-left:0;margin-top:10px}

  background:var(--c-blue-l);border-bottom:1px solid var(--c-blue);

<body>
<div id="app">
  <header>
    <button id="btn-menu" aria-label="Abrir menú">≡</button>
    <div class="brand">SGI <span>Gestión de Inventario</span></div>
    <div class="hd-ctx">
      <span class="hd-ed" id="hd-sesion" title="Clic para cambiar centro y usuario"><b id="hd-cd">—</b>
        · <b id="hd-user">—</b></span><i class="hd-sep"></i>
      <span class="hd-ed" id="hd-exist" title="Clic para cargar existencias">Existencias: <b id="hd-foto">—</b></span><i class="hd-sep"></i>
      <span id="hd-clock">—</span>
    </div>
  </header>
  <nav id="nav"></nav>

    <span class="sp" id="ft-ver">SGI</span>
  </footer>
</div>
<div id="modal-host"></div>
<div id="msg"></div>
<script>
/* SGI - CFG parametros · DB datos · UI componentes · VIEWS pantallas · APP router Las reglas de negocio viven en CFG, editables desde Configuracion. */

/* ==========  1. CONFIGURACIoN (todo parametrizable) ====================== */
const CFG = {
  empresa:'Mi empresa',
  centro:'Centro de distribucion',
  moneda:'RD$',
  usuario:'Usuario',
  rol:'Supervisor de almacen',

  /* Metas e indicadores */
  metaExactitud:98.0,
  metaCumplimiento:95.0,
  alertaExactitud:96.0,

  /* Tolerancias por clase ABC: % sobre teorico y minimo en unidades */
  tolerancia:{
    A:{pct:0.50,min:1},
    B:{pct:1.00,min:2},
    C:{pct:2.00,min:5}
  },
  /* Frecuencia de conteo ciclico por clase (dias) */
  frecuencia:{A:30,B:60,C:120},

  /* Operacion */
  filasPorPagina:25,
  lineasPorHoja:150,
  decimales:2,

  /* Causas */
  causas:['Error de picking','Error de captura','Error de recepcion',
          'Mercancia en otra ubicacion','Salida sin documentar','Entrada sin documentar',
          'Producto danado','Merma confirmada','Vencimiento','Robo confirmado',
          'Error del suplidor'],
  zonas:[],
  tiposConteo:['Ciclico','Total','Puntual','Por diferencia'],
  responsables:[]
};

/* ==========  2. UTILIDADES ============================================== */
const U = {
  /* Generador determinista para el juego de datos de demostración */
  _s:20260731,
  rnd(){ U._s=(U._s*1664525+1013904223)>>>0; return U._s/4294967296; },
  ri(a,b){ return a+Math.floor(U.rnd()*(b-a+1)); },
  pick(a){ return a[U.ri(0,a.length-1)]; },
  n(v,d){ return (v==null||isNaN(v))?'—':Number(v).toLocaleString('es-DO',
          {minimumFractionDigits:d??0,maximumFractionDigits:d??0}); },
  m(v){ return CFG.moneda+' '+U.n(v,CFG.decimales); },
  p(v){ return (v==null||isNaN(v))?'—':Number(v).toFixed(2)+'%'; },
  d(x){ return x?new Date(x).toISOString().slice(0,10):'—'; },
  /* Hora local del equipo: toISOString da UTC y en RD adelanta el dia a las 8 pm */
  hoy(){ const d=new Date(), z=n=>String(n).padStart(2,'0');
    return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); },
  ts(){ const d=new Date(), z=n=>String(n).padStart(2,'0');
    return U.hoy()+' '+z(d.getHours())+':'+z(d.getMinutes())+':'+z(d.getSeconds()); },
  addDays(dt,n){ const d=new Date(dt); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); },
  /* Un solo comparador reutilizable */
  col:new Intl.Collator('es',{numeric:true,sensitivity:'base'}),
  zonaDe(ub){ return String(ub||'').split('-')[0]; },
  esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  id(pfx,n){ return pfx+'-'+String(n).padStart(5,'0'); },
  /* Tolerancia según clase ABC — leída siempre desde CFG */
  tol(clase,teorico){
    const t=CFG.tolerancia[clase]||{pct:0,min:0};
    return Math.max(t.min, Math.abs(teorico)*t.pct/100);
  },
  dentroTol(clase,teorico,dif){ return Math.abs(dif)<=U.tol(clase,teorico); },
  csv(nombre,cols,rows){
    const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const txt=[cols.map(c=>esc(c.label)).join(';')]
      .concat(rows.map(r=>cols.map(c=>esc(c.raw?c.raw(r):r[c.key])).join(';'))).join('\r\n');
    const b=new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download=nombre+'_'+U.hoy()+'.csv'; a.click();
    URL.revokeObjectURL(a.href); UI.msg('Archivo exportado: '+nombre+'.csv','ok');
  },
  /* Lee un archivo subido y devuelve texto listo para DB.leer: Excel (.xlsx) o CSV/TXT, sin convertir nada */
  async textoDeArchivo(f){
    const buf=await f.arrayBuffer();
    if(/\.xls[xm]$/i.test(f.name)) return U.xlsxATexto(buf);
    if(/\.xls$/i.test(f.name)) throw new Error('Ese es un Excel antiguo (.xls). Guardelo como .xlsx, o copie las celdas y peguelas aqui');
    try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }
    catch(e){ return new TextDecoder('windows-1252').decode(buf); }   /* CSV guardado por Excel en Windows */
  },
  /* Lee la primera hoja de un .xlsx (zip + XML) sin librerias. Devuelve texto separado por tabulacion. */
  async xlsxATexto(buf){
    const dv=new DataView(buf), u8=new Uint8Array(buf);
    let fin=-1;
    for(let i=u8.length-22;i>=Math.max(0,u8.length-65558);i--){
      if(dv.getUint32(i,true)===0x06054b50){ fin=i; break; } }
    if(fin<0) throw new Error('El archivo no es un Excel (.xlsx) valido');
    const n=dv.getUint16(fin+10,true); let p=dv.getUint32(fin+16,true);
    const ent={};
    for(let k=0;k<n;k++){
      if(dv.getUint32(p,true)!==0x02014b50) break;
      const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);
      const nombre=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
      ent[nombre]={m:dv.getUint16(p+10,true),cs:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)};
      p+=46+nl+xl+cl;
    }
    const leer=async nombre=>{
      const z=ent[nombre]; if(!z) return null;
      const o=z.off, d0=o+30+dv.getUint16(o+26,true)+dv.getUint16(o+28,true);
      let datos=u8.subarray(d0,d0+z.cs);
      if(z.m===8) datos=new Uint8Array(await new Response(new Blob([datos]).stream()
        .pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      else if(z.m!==0) throw new Error('Este Excel usa una compresion que no se puede leer');
      return new TextDecoder().decode(datos);
    };
    const xml=async nombre=>{ const t=await leer(nombre); return t?new DOMParser().parseFromString(t,'application/xml'):null; };
    /* Primera hoja del libro */
    let hoja='xl/worksheets/sheet1.xml';
    const wb=await xml('xl/workbook.xml'), rl=await xml('xl/_rels/workbook.xml.rels');
    if(wb&&rl){
      const sh=wb.getElementsByTagName('sheet')[0];
      const rid=sh&&(sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'));
      const r=[...rl.getElementsByTagName('Relationship')].find(x=>x.getAttribute('Id')===rid);
      if(r) hoja='xl/'+r.getAttribute('Target').replace(/^\/?(xl\/)?/,'');
    }
    /* Textos compartidos */
    const ss=[], sx=await xml('xl/sharedStrings.xml');
    if(sx) [...sx.getElementsByTagName('si')].forEach(si=>
      ss.push([...si.getElementsByTagName('t')].map(t=>t.textContent).join('')));
    /* Estilos que son fecha (Excel guarda las fechas como numero) */
    const fecha=new Set(), st=await xml('xl/styles.xml');
    if(st){
      const cus={};
      [...st.getElementsByTagName('numFmt')].forEach(f=>cus[f.getAttribute('numFmtId')]=f.getAttribute('formatCode'));
      const xfs=st.getElementsByTagName('cellXfs')[0];
      if(xfs) [...xfs.getElementsByTagName('xf')].forEach((x,i)=>{
        const id=+x.getAttribute('numFmtId'), c=cus[id];
        if((id>=14&&id<=22)||(id>=45&&id<=47)||(c&&/[dmy]/i.test(c.replace(/"[^"]*"|\[[^\]]*\]|\\./g,'')))) fecha.add(i);
      });
    }
    const sh=await xml(hoja);
    if(!sh) throw new Error('No se pudo leer la hoja del Excel');
    const colN=ref=>{ let c=0; for(const ch of ref.replace(/\d/g,'')) c=c*26+ch.charCodeAt(0)-64; return c-1; };
    const filas=[];
    [...sh.getElementsByTagName('row')].forEach(r=>{
      const fila=[]; let sig=0;
      [...r.getElementsByTagName('c')].forEach(c=>{
        const ref=c.getAttribute('r'), i=ref?colN(ref):sig; sig=i+1;
        const t=c.getAttribute('t'), v=c.getElementsByTagName('v')[0];
        let val='';
        if(t==='inlineStr') val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');
        else if(v){
          val=v.textContent;
          if(t==='s') val=ss[+val]??'';
          else if(t==='b') val=val==='1'?'SI':'NO';
          else if(t==='e') val='';
          else if(t!=='str'){
            if(fecha.has(+(c.getAttribute('s')||0))&&val!==''&&!isNaN(val))
              val=new Date(Date.UTC(1899,11,30)+Math.floor(+val)*864e5).toISOString().slice(0,10);
            else if(/^-?\d+\.\d{3}$/.test(val)) val+='0';   /* 12.125 no se confunde con miles */
          }
        }
        fila[i]=String(val).replace(/[\t\r\n]+/g,' ').trim();
      });
      filas.push(Array.from(fila,x=>x??'').join('\t'));
    });
    return filas.join('\n');
  }
};

/* ========== 3. */
const DB = {
  productos:[], ubicaciones:[], stock:[], conteos:[], discrepancias:[], historial:[],
  seq:{conteo:0, disc:0},
  /* Las existencias son una FOTO del sistema que manda, no un maestro vivo. */
  foto:{fecha:'',hora:'',origen:''},

  /* Guardado local opcional. Apagado de fabrica: la app abre en blanco. */
  LLAVE:'sgi.v2',
  LLAVE_ON:'sgi.v2.on',
  /* Nace APAGADO a proposito */
  autoguardar:false,
  _tmr:null,
  guardar(ya){
    if(!DB.autoguardar) return;
    clearTimeout(DB._tmr);
    const hacer=()=>{
      /* Salvaguarda */
      try{
        if(!ya && !DB.stock.length && !DB.conteos.length &&
           localStorage.getItem(DB.LLAVE)) return;
      }catch(e){ return; }
      try{
        localStorage.setItem(DB.LLAVE, JSON.stringify({
          v:2, ts:U.ts(), cfg:CFG,
          productos:DB.productos, ubicaciones:DB.ubicaciones, stock:DB.stock,
          conteos:DB.conteos, discrepancias:DB.discrepancias,
          historial:DB.historial.slice(0,500), seq:DB.seq, foto:DB.foto}));
        DB._err=false;
      }catch(e){
        /* Se lleno el espacio del navegador: se avisa una sola vez */
        if(!DB._err){ DB._err=true; DB.autoguardar=false;
          UI.msg('No se pudo guardar en este navegador: falta espacio. Exporte a CSV lo que necesite','warn'); }
      }
    };
    ya ? hacer() : DB._tmr=setTimeout(hacer,800);
  },
  recuperar(){
    let d=null;
    try{ d=JSON.parse(localStorage.getItem(DB.LLAVE)||'null'); }catch(e){ d=null; }
    if(!d||!d.stock) return null;
    Object.assign(CFG,d.cfg||{});
    DB.productos=d.productos||[]; DB.ubicaciones=d.ubicaciones||[]; DB.stock=d.stock||[];
    DB.conteos=d.conteos||[];     DB.discrepancias=d.discrepancias||[];
    DB.historial=d.historial||[]; DB.seq=d.seq||{conteo:0,disc:0};
    DB.foto=d.foto||{fecha:'',hora:'',origen:''};
    DB.indexar();
    return d.ts;
  },
  olvidar(){ try{ localStorage.removeItem(DB.LLAVE); }catch(e){} },
  prender(v){
    DB.autoguardar=!!v;
    try{ v ? localStorage.setItem(DB.LLAVE_ON,'1') : localStorage.removeItem(DB.LLAVE_ON); }catch(e){}
    if(!v) DB.olvidar();          /* apagarlo borra la copia: nada de fantasmas */
  },
  init(){
    let on=false;
    try{ on=localStorage.getItem(DB.LLAVE_ON)==='1'; }catch(e){}
    DB.autoguardar=on;
    if(!on){
      /* Sin permiso expreso no se recupera nada y se limpia lo que haya quedado de una version anterior */
      DB.olvidar();
      DB.log('Sistema','Inicio','Base vacia. Cargue sus existencias con el boton Cargar existencias');
      return;
    }
    const ts=DB.recuperar();
    DB.log('Sistema','Inicio', ts
      ? 'Datos recuperados de este navegador - guardado el '+ts
      : 'Base vacia. Cargue sus existencias con el boton Cargar existencias');
  },

  /* --- Indices ------------------------------------------------------- */
  _ix:{prod:new Map(),stock:new Map()},
  indexar(){
    DB._ix.prod =new Map(DB.productos.map(p=>[p.sku,p]));
    DB._ix.stock=new Map(DB.stock.map(s=>[s.ub+'|'+s.sku+'|'+s.lote,s]));
  },
  /* --- Consultas ---------------------------------------------------- */
  prod(sku){
    if(DB._ix.prod.size!==DB.productos.length) DB.indexar();
    return DB._ix.prod.get(sku)||{desc:sku,um:'UN',clase:'C',costo:0};
  },
  stockDe(ub,sku,lote){
    if(DB._ix.stock.size!==DB.stock.length) DB.indexar();
    return DB._ix.stock.get(ub+'|'+sku+'|'+lote);
  },
  conteo(id){ return DB.conteos.find(c=>c.id===id); },
  disc(id){ return DB.discrepancias.find(d=>d.id===id); },
  fis(l){ return l.fisico; },
  dif(l){ const f=DB.fis(l); return f==null?0:f-l.teorico; },
  valor(l){ return +(DB.dif(l)*l.costo).toFixed(2); },
  estadoLinea(l){
    /* Una linea que nadie conto NO es una linea que cuadro. */
    if(l.sinContar) return 'SIN CONTAR';
    const f=DB.fis(l);
    if(f==null) return 'PENDIENTE';
    const d=DB.dif(l);
    if(d===0) return 'EXACTO';
    /* Con la tolerancia que regia cuando se creo el conteo, no con la de hoy */
    const t = l.tol!=null ? l.tol : U.tol(l.clase,l.teorico);
    return Math.abs(d)<=t ? 'TOLERADO' : 'DIFERENCIA';
  },
  avance(c){
    const t=c.lineas.length, h=c.lineas.filter(l=>DB.fis(l)!=null).length;
    return {t,h,pct:t?h*100/t:0};
  },
  /* Exactitud */
  eri(lineas){
    const c=lineas.filter(l=>!l.sinContar && DB.fis(l)!=null);
    if(!c.length) return null;
    const ok=c.filter(l=>DB.estadoLinea(l)!=='DIFERENCIA').length;
    return ok*100/c.length;
  },
  lineasContadas(){ return DB.conteos.flatMap(c=>c.lineas); },
  /* Diferencias que alguien miro y dio por buenas, con su causa */
  confirmadas(){ return DB.lineasContadas().filter(l=>l.confirmada); },
  fotoVieja(){
    if(!DB.foto.fecha) return null;
    return Math.round((new Date(U.hoy())-new Date(DB.foto.fecha))/864e5);
  },
  difs(){ return DB.lineasContadas().filter(l=>DB.estadoLinea(l)==='DIFERENCIA'); },

  /* --- Discrepancias ------------------------------------------------- Una discrepancia es la investigacion de un problema. */
  discDe(idConteo){ return DB.discrepancias.filter(d=>d.conteo===idConteo); },
  discAbiertas(idConteo){ return DB.discDe(idConteo).filter(d=>d.estado!=='RESUELTA'); },
  /* Marca permanente del conteo */
  marca(c){
    const d=DB.discDe(c.id);
    const conf=(c.lineas||[]).filter(l=>l.confirmada).length;
    if(!d.length&&!conf) return null;
    const ab=d.filter(x=>x.estado!=='RESUELTA').length;
    /* amarillo = todavia se esta investigando; rojo = cerrado con discrepancia */
    return ab ? {k:'ab',n:ab,t:ab+' discrepancia(s) en investigacion'}
              : {k:'dif',n:d.length+conf,
                 t:'Cerrado con discrepancia: '+(d.length+conf)+' linea(s) con diferencia'};
  },
  diasDisc(d){ return Math.round((new Date(U.hoy())-new Date(d.fecha))/864e5); },

  /* --- Borrado de datos --------------------------------------------- */
  limpiar(todo){
    DB.conteos=[]; DB.discrepancias=[]; DB.seq={conteo:0,disc:0};
    if(todo){ DB.productos=[]; DB.ubicaciones=[]; DB.stock=[]; CFG.zonas=[]; }
    else DB.stock.forEach(s=>s.ultConteo=U.hoy());
    DB.historial=[];
    if(todo) DB.foto={fecha:'',hora:'',origen:''};
    DB.log('Configuracion',todo?'Borrar todos los datos':'Borrar movimientos',
      todo?'Existencias y conteos eliminados':'Conteos, discrepancias e historial eliminados');
    DB.guardar(true);
  },
  /* --- Carga de existencias desde CSV -------------------------------- */
  plantillaCSV(){
    return 'ubicacion;tipo;sku;descripcion;um;clase;costo;lote;vence;cantidad\r\n'+
           'A-01-2-3;RACK;SKU-0001;Descripcion del articulo;CJ;A;0.00;LOTE-1;2027-12-31;0\r\n'+
           'A-PI-01;PISO;SKU-0002;Descripcion del articulo;SAC;B;0.00;SIN LOTE;;0';
  },
  /* Lee un pegado de Excel (TAB) o un CSV. No escribe: devuelve lo leido. */
  ALIAS:{
    ub:['ubicacion','ubicación','ubic','localidad','location','bin','posicion','posición','almacen','almacén'],
    tipo:['tipo','tipo ubicacion','tipo de ubicacion','clase ubicacion'],
    sku:['sku','codigo','código','articulo','artículo','item','material','producto','cod','codigo articulo','número de artículo','numero de articulo'],
    desc:['descripcion','descripción','desc','nombre','detalle','producto descripcion'],
    um:['um','unidad','u.m.','unidad medida','unidad de medida','uom'],
    clase:['clase','abc','clase abc','categoria','categoría'],
    costo:['costo','precio','costo unitario','valor','costo unit','precio unitario'],
    lote:['lote','batch','lot'],
    vence:['vence','vencimiento','caducidad','fecha vencimiento','expira','exp'],
    cant:['cantidad','cant','existencia','existencias','stock','teorico','teórico','qty','saldo','disponible','on hand','cantidad sistema','cantidad teorica']
  },
  leer(texto){
    const crudo=String(texto||'').replace(/\r/g,'');
    const filas=crudo.split('\n').map(x=>x.trimEnd()).filter(x=>x.trim());
    if(!filas.length) return {cols:{},datos:[],errores:['No hay nada que leer'],sep:''};
    /* Separador */
    const cuenta=ch=>(filas[0].split(ch).length-1);
    const sep=['\t',';',',','|'].sort((a,b)=>cuenta(b)-cuenta(a))[0];
    /* Partir respetando comillas */
    const part=ln=>{
      const out=[]; let cur='', dentro=false;
      for(let i=0;i<ln.length;i++){
        const ch=ln[i];
        if(ch==='"'){ if(dentro&&ln[i+1]==='"'){ cur+='"'; i++; } else dentro=!dentro; }
        else if(ch===sep&&!dentro){ out.push(cur); cur=''; }
        else cur+=ch;
      }
      out.push(cur);
      return out.map(x=>x.trim());
    };
    const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
    /* Encabezado por nombre */
    const pr=part(filas[0]), cols={};
    Object.entries(DB.ALIAS).forEach(([k,lista])=>{
      const li=lista.map(norm);
      const i=pr.findIndex(t=>li.includes(norm(t)));
      if(i>=0) cols[k]=i;
    });
    let hayEnc=Object.keys(cols).length>=2;
    if(!hayEnc){ /* sin encabezado reconocible: orden de la plantilla */
      ['ub','tipo','sku','desc','um','clase','costo','lote','vence','cant']
        .forEach((k,i)=>cols[k]=i);
      /* la primera fila es titulo si su ultima celda no es un numero */
      hayEnc=!/^-?\d+([.,]\d+)?$/.test((pr[pr.length-1]||'').trim());
    }
    /* Numeros como los escribe la gente aqui */
    const num=v=>{
      let t=String(v||'').replace(/[^0-9,.\-]/g,'');
      if(!t) return 0;
      const hayC=t.includes(','), hayP=t.includes('.');
      if(hayC&&hayP){
        t = t.lastIndexOf(',')>t.lastIndexOf('.')
          ? t.replace(/\./g,'').replace(',','.')
          : t.replace(/,/g,'');
      }else if(hayC||hayP){
        const sg=hayC?',':'.', veces=(t.split(sg).length-1);
        const cola=t.slice(t.lastIndexOf(sg)+1);
        const miles = veces>1 || (cola.length===3 && /^\d+$/.test(cola));
        t = miles ? t.split(sg).join('') : t.replace(sg,'.');
      }
      return +t||0;
    };
    const err=[], datos=[];
    filas.slice(hayEnc?1:0).forEach((ln,i)=>{
      const c=part(ln), g=k=>cols[k]!=null?(c[cols[k]]||''):'';
      const ub=g('ub').toUpperCase(), sku=g('sku')||g('desc');
      if(!ub&&!sku) return;                       /* fila en blanco: se salta callada */
      if(!ub){ err.push('Fila '+(i+1)+': sin ubicacion'); return; }
      if(!sku){ err.push('Fila '+(i+1)+': sin codigo de articulo'); return; }
      const cl=['A','B','C'].includes(g('clase').toUpperCase())?g('clase').toUpperCase():'C';
      datos.push({ub,sku,desc:g('desc')||sku,um:(g('um')||'UN').toUpperCase(),clase:cl,
        costo:num(g('costo')),lote:g('lote')||'SIN LOTE',vence:g('vence'),
        cant:Math.round(num(g('cant'))),
        tipo:(g('tipo')||'').toUpperCase()==='PISO'?'PISO':'RACK'});
    });
    return {cols,datos,errores:err,sep:{'\t':'tabulacion (Excel)',';':'punto y coma',',':'coma','|':'barra'}[sep],
            reconocidas:Object.keys(cols).filter(k=>cols[k]!=null)};
  },
  /* Escribe lo que ya se leyo y se confirmo. */
  aplicar(datos){
    let alta=0,upd=0;
    const ixP=new Map(DB.productos.map(p=>[p.sku,p]));
    const ixU=new Set(DB.ubicaciones.map(u=>u.cod));
    const ixS=new Map(DB.stock.map(s=>[s.ub+'|'+s.sku+'|'+s.lote,s]));
    let sid=DB.stock.reduce((m,s)=>Math.max(m,s.id),0);
    datos.forEach(d=>{
      const p=ixP.get(d.sku);
      if(!p){ const np={sku:d.sku,desc:d.desc,um:d.um,clase:d.clase,costo:d.costo,
              familia:(d.desc||d.sku).split(' ')[0].toUpperCase()};
        DB.productos.push(np); ixP.set(d.sku,np); }
      else if(d.costo&&!p.costo) p.costo=d.costo;
      const zona=(d.ub.split('-')[0]||'?').toUpperCase();
      if(!ixU.has(d.ub)){ ixU.add(d.ub);
        DB.ubicaciones.push({cod:d.ub,zona,pasillo:0,rack:0,nivel:0,tipo:d.tipo,cap:0}); }
      if(!CFG.zonas.includes(zona)) CFG.zonas.push(zona);
      const k=d.ub+'|'+d.sku+'|'+d.lote, ex=ixS.get(k);
      if(ex){ ex.teorico=d.cant; if(d.vence) ex.vence=d.vence; upd++; }
      else{ const ns={id:++sid,ub:d.ub,zona,tipo:d.tipo,sku:d.sku,lote:d.lote,
              vence:d.vence,teorico:d.cant,ultConteo:U.hoy()};
        DB.stock.push(ns); ixS.set(k,ns); alta++; }
    });
    DB.indexar();
    DB.foto={fecha:U.hoy(),hora:U.ts().slice(11),origen:'Carga de existencias'};
    DB.log('Configuracion','Cargar existencias',
      alta+' nueva(s), '+upd+' actualizada(s)');
    DB.guardar(true);
    return {alta,upd};
  },
  /* Toda accion que deja rastro en el historial se guarda tambien. */
  log(modulo,accion,detalle){
    DB.historial.unshift({ts:U.ts(),usuario:CFG.usuario,modulo,accion,detalle});
    DB.guardar();
  },

  /* Datos de prueba: llena la base de una vez. Borra lo que haya. */
  corridaPrueba(nItems){
    nItems=nItems||400;
    DB.limpiar(true);
    U._s=20260731;                                   /* semilla fija */

    const zonas=['A','B','C','D'];
    CFG.zonas=zonas.slice();
    CFG.responsables=['Ana Reyes','Luis Pena','Marcos Diaz','Sandra Objio','Elvis Mota'];

    const arts=['Aceite','Arroz','Azucar','Harina','Jabon','Detergente','Papel toalla','Salsa',
      'Cafe','Leche','Atun','Galleta','Pasta','Sal','Vinagre','Cloro','Servilleta','Cereal',
      'Avena','Habichuela','Maiz','Mayonesa','Ketchup','Refresco','Agua','Jugo','Desodorante',
      'Shampoo','Pasta dental','Guante','Mascarilla','Cinta','Bolsa','Film','Etiqueta'];
    const var_=['premium','familiar','economico','industrial','importado','nacional',
      'x12','x24','1 L','5 L','500 g','1 kg','20 kg','pack 6','display 24'];
    const ums=['UN','CJ','SAC','PQ','GL'];

    /* --- Articulos: A caro y poco, C barato y mucho ------------------ */
    const nSku=Math.max(40,Math.round(nItems*0.55));
    for(let i=1;i<=nSku;i++){
      const r=U.rnd();
      const clase = r<0.20?'A' : (r<0.50?'B':'C');
      const costo = clase==='A' ? U.ri(800,6000) : (clase==='B'?U.ri(120,800):U.ri(8,120));
      const desc=U.pick(arts)+' '+U.pick(var_);
      DB.productos.push({sku:U.id('SKU',i),desc,um:U.pick(ums),clase,
        costo:+(costo+U.rnd()).toFixed(2),familia:desc.split(' ')[0].toUpperCase()});
    }

    /* --- Ubicaciones y existencias ----------------------------------- */
    const hechas=new Set();
    for(let i=1;i<=nItems;i++){
      const z=U.pick(zonas), piso=U.rnd()<0.15;
      const cod = piso ? z+'-PI-'+String(U.ri(1,20)).padStart(2,'0')
                       : z+'-'+String(U.ri(1,14)).padStart(2,'0')+'-'+U.ri(1,6)+'-'+U.ri(1,4);
      if(!hechas.has(cod)){ hechas.add(cod);
        DB.ubicaciones.push({cod,zona:z,pasillo:+(cod.split('-')[1])||0,rack:0,nivel:0,
          tipo:piso?'PISO':'RACK',cap:0}); }
      const p=DB.productos[U.ri(0,DB.productos.length-1)];
      const lote = U.rnd()<0.55 ? 'L'+U.ri(2601,2632) : 'SIN LOTE';
      if(DB.stock.some(s=>s.ub===cod&&s.sku===p.sku&&s.lote===lote)){ i--; continue; }
      DB.stock.push({id:i,ub:cod,zona:z,tipo:piso?'PISO':'RACK',sku:p.sku,lote,
        vence: lote==='SIN LOTE'?'':U.addDays(U.hoy(),U.ri(20,700)),
        teorico: p.clase==='A'?U.ri(4,90):(p.clase==='B'?U.ri(20,400):U.ri(50,1200)),
        ultConteo:U.addDays(U.hoy(),-U.ri(1,200))});
    }
    DB.indexar();
    DB.foto={fecha:U.hoy(),hora:U.ts().slice(11),origen:'Corrida de prueba'};

    /* --- Conteos repartidos en los ultimos 6 meses ------------------- Se siembran fechas a proposito en hoy, ayer y esta semana para que los filtros de pe */
    const dias=[0,0,1,2,3,5,8,12,17,23,29,34,41,48,55,63,72,80,88,97,105,118,130,145,160,175];
    const armar=(diasAtras)=>{
      const f=U.addDays(U.hoy(),-diasAtras);
      const n=U.ri(8,40), usados=new Set(), lineas=[];
      while(lineas.length<n){
        const s=DB.stock[U.ri(0,DB.stock.length-1)];
        if(usados.has(s.id)) continue; usados.add(s.id);
        const p=DB.prod(s.sku);
        lineas.push({stockId:s.id,ub:s.ub,sku:s.sku,desc:p.desc,um:p.um,clase:p.clase,
          costo:p.costo,lote:s.lote,vence:s.vence,teorico:s.teorico,
          tol:U.tol(p.clase,s.teorico),
          fisico:null,cerrada:false,decision:'',causa:'',disc:null});
      }
      return {id:U.id('CT',++DB.seq.conteo),tipo:U.pick(CFG.tiposConteo),
        zona:U.pick(zonas),estado:'ABIERTO',
        criterio:'Corrida de prueba - '+U.pick(['ciclo de clase A','zona completa',
          'articulos de alta rotacion','pendientes de ciclo','revision de lotes']),
        responsable:U.pick(CFG.responsables),fechaPlan:f,fechaEjec:null,fechaCierre:null,lineas};
    };
    /* Un punado de ubicaciones problematicas */
    const malas=new Set();
    while(malas.size<6) malas.add(DB.stock[U.ri(0,DB.stock.length-1)].ub);
    /* Escribe la cantidad contada: la mayoria cuadra, unas pocas no */
    const contar=(c,pctDif)=>{
      c.lineas.forEach(l=>{
        const r=U.rnd();
        if(malas.has(l.ub) ? r<0.8 : r<pctDif){        /* diferencia de verdad */
          const mag=Math.max(2,Math.round(l.teorico*(0.03+U.rnd()*0.22)));
          l.fisico=Math.max(0,l.teorico+(U.rnd()<0.72?-mag:mag));
        }else if(r<pctDif+0.06){                       /* roce dentro de tolerancia */
          const t=Math.max(1,Math.floor(U.tol(l.clase,l.teorico)));
          l.fisico=Math.max(0,l.teorico+(U.rnd()<0.5?-t:t));
        }else l.fisico=l.teorico;                      /* cuadro */
      });
    };
    const abrirCaso=(c,l,f)=>{
      const d={id:U.id('DC',++DB.seq.disc),conteo:c.id,fecha:f,
        ub:l.ub,sku:l.sku,desc:l.desc,lote:l.lote,clase:l.clase,costo:l.costo,
        teorico:l.teorico,fisico:l.fisico,dif:DB.dif(l),valor:DB.valor(l),
        estado:'ABIERTA',responsable:U.pick(CFG.responsables),
        compromiso:U.addDays(f,U.ri(3,15)),causa:'',resuelvePor:'',fechaResuelta:'',
        ajustado:false,perdida:0,
        notas:[{ts:f+' 08:00:00',usuario:U.pick(CFG.responsables),
          txt:'Caso abierto desde el conteo '+c.id+' - sistema '+U.n(l.teorico)+
              ', contado '+U.n(l.fisico)+' ('+(DB.dif(l)>0?'+':'')+U.n(DB.dif(l))+')'}]};
      l.cerrada=true; l.decision='En investigacion - '+d.id; l.disc=d.id;
      DB.discrepancias.unshift(d);
      return d;
    };

    let ok=0,disc=0,inv=0;
    dias.forEach((da,i)=>{
      const c=armar(da), f=U.addDays(U.hoy(),-da);
      /* Dos recientes quedan a medias, para probar la hoja de conteo en curso */
      if(i===1||i===4){
        c.lineas.forEach((l,k)=>{ if(k<Math.floor(c.lineas.length*0.45)) l.fisico=l.teorico; });
        c.fechaEjec=f; DB.conteos.push(c); return;
      }
      /* Uno de cada tres cuadra limpio; uno de cada cinco sale feo */
      contar(c, i%5===0 ? 0.14 : (i%3===0 ? 0 : 0.035));
      const dif=c.lineas.filter(l=>DB.estadoLinea(l)==='DIFERENCIA');
      c.lineas.forEach(l=>{
        const e=DB.estadoLinea(l);
        if(e==='EXACTO'){   l.cerrada=true; l.decision='Sin diferencia'; }
        if(e==='TOLERADO'){ l.cerrada=true; l.decision='Dentro de tolerancia'; }
      });
      /* Reparte las tres salidas para que el archivo tenga de todo */
      if(!dif.length){ ok++; }
      else if(U.rnd()<0.55){                            /* CERRADO CON DISCREPANCIA */
        disc++;
        dif.forEach(l=>{ l.cerrada=true; l.confirmada=true; l.causa=U.pick(CFG.causas);
          l.quien=U.pick(CFG.responsables); l.cuando=f;
          l.decision='Diferencia confirmada - '+l.causa; });
      }else{                                            /* EN INVESTIGACION */
        inv++;
        dif.forEach(l=>{
          const d=abrirCaso(c,l,f);
          const r=U.rnd();
          if(r<0.45){                                   /* ya resuelto */
            d.estado='RESUELTA'; d.causa=U.pick(CFG.causas);
            d.resuelvePor=U.pick(CFG.responsables);
            d.fechaResuelta=U.addDays(f,U.ri(2,20));
            d.perdida=d.valor<0?Math.abs(d.valor):0;
            d.notas.push({ts:d.fechaResuelta+' 16:30:00',usuario:d.resuelvePor,
              txt:'Caso cerrado - '+d.causa+(d.perdida?' - perdida confirmada':' - sin perdida')});
          }else if(r<0.70){ d.estado='EN INVESTIGACION';
            d.notas.push({ts:U.addDays(f,2)+' 11:00:00',usuario:d.responsable,
              txt:'Se reviso la ubicacion vecina, sigue sin aparecer'});
          }
        });
      }
      c.estado='CERRADO'; c.fechaEjec=f; c.fechaCierre=f;
      DB.conteos.push(c);
      c.lineas.forEach(l=>{ const s=DB.stock.find(x=>x.id===l.stockId); if(s) s.ultConteo=f; });
    });
    /* Cuatro quedaron programados y nunca se ejecutaron */
    [4,11,26,54].forEach(da=>{ const c=armar(da); c.fechaPlan=U.addDays(U.hoy(),-da);
      c.fechaEjec=null; c.fechaCierre=null; c.estado='ABIERTO'; DB.conteos.push(c); });
    DB.conteos.sort((a,b)=>String(b.fechaPlan).localeCompare(String(a.fechaPlan)));

    const abiertos=DB.discrepancias.filter(d=>d.estado!=='RESUELTA').length;
    DB.log('Configuracion','Corrida de prueba',
      `${U.n(nItems)} existencias, ${U.n(DB.productos.length)} articulos, `+
      `${U.n(DB.conteos.length)} conteos (${ok} ok, ${disc} con discrepancia, ${inv} investigados), `+
      `${U.n(DB.discrepancias.length)} caso(s), ${abiertos} sin resolver`);
    /* Data de prueba */
    DB.olvidar();
    return {items:DB.stock.length,skus:DB.productos.length,ubic:DB.ubicaciones.length,
            conteos:DB.conteos.length,ok,disc,inv,casos:DB.discrepancias.length,abiertos};
  }
};

/* ==========  4. COMPONENTES DE INTERFAZ REUTILIZABLES ==================== */
const UI = {
  msg(txt,tipo){
    const d=document.createElement('div');
    d.className='toast '+(tipo||'');
    d.textContent=txt;
    document.getElementById('msg').appendChild(d);
    document.getElementById('ft-status').textContent=txt;
    setTimeout(()=>d.remove(),3200);
  },
  st(estado){
    const map={
      'EXACTO':'g','TOLERADO':'a','DIFERENCIA':'r','PENDIENTE':'n','SIN CONTAR':'n',
      'ABIERTO':'b','CERRADO':'g','CONTADO':'a',
      'ABIERTA':'r','EN INVESTIGACION':'a','RESUELTA':'g',
      'APLICADO':'g','SIN AJUSTE':'n'
    };
    return `<span class="st ${map[estado]||'n'}">${U.esc(estado)}</span>`;
  },
  num(v,d){ const c=v<0?'neg':(v>0?'pos':''); return `<span class="${c}">${U.n(v,d)}</span>`; },

  /* --- Tabla genérica: orden, paginación, selección, exportación ------ */
  tabla(host,{cols,rows,state,onRow,onSel,vacio}){
    const st=state;
    st.sort??=cols[0].key; st.dir??=1; st.pag??=1; st.per??=CFG.filasPorPagina;
    const data=[...rows];
    const col=cols.find(c=>c.key===st.sort);
    if(col&&col.sort!==false){
      const val=r=>col.val?col.val(r):r[col.key];
      data.sort((a,b)=>{
        const x=val(a),y=val(b);
        if(x==null) return 1; if(y==null) return -1;
        return (typeof x==='number'&&typeof y==='number' ? x-y : U.col.compare(String(x),String(y)))*st.dir;
      });
    }
    const tot=data.length, tp=Math.max(1,Math.ceil(tot/st.per));
    if(st.pag>tp) st.pag=tp;
    const page=data.slice((st.pag-1)*st.per, st.pag*st.per);

    const th=cols.map(c=>`<th class="${c.sort===false?'nos':''} ${c.a||''}" data-k="${c.key}"
        style="${c.w?'width:'+c.w+'px':''}">${U.esc(c.label)}${
        st.sort===c.key&&c.sort!==false?`<span class="ar">${st.dir>0?'▲':'▼'}</span>`:''}</th>`).join('');
    /* data-l alimenta la vista apilada de móvil: la etiqueta viaja con la celda */
    const tb = page.length? page.map((r,i)=>`<tr data-i="${i}" class="${onSel&&st.selId===r[st.selKey||'id']?'sel':''}">`+
        cols.map(c=>`<td class="${c.a||''} ${c.cls?c.cls(r):''}" data-l="${U.esc(c.label)}">${c.fmt?c.fmt(r):U.esc(r[c.key])}</td>`).join('')+'</tr>').join('')
      : `<tr><td class="t-empty" colspan="${cols.length}">${vacio||'Sin registros para los filtros aplicados.'}</td></tr>`;

    host.innerHTML=`<div class="tbl-wrap"><table class="t"><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>
      <div class="pag"><span>${U.n(tot)} registro(s) · página ${st.pag} de ${tp}</span>
      <span class="sp">
        <label class="muted">Filas</label>
        <select data-per>${[10,25,50,100,200].map(n=>`<option ${n===st.per?'selected':''}>${n}</option>`).join('')}</select>
        <button class="btn xs no-mov" data-pg="1" ${st.pag===1?'disabled':''}>«</button>
        <button class="btn xs" data-pg="${st.pag-1}" ${st.pag===1?'disabled':''}>‹</button>
        <button class="btn xs" data-pg="${st.pag+1}" ${st.pag===tp?'disabled':''}>›</button>
        <button class="btn xs no-mov" data-pg="${tp}" ${st.pag===tp?'disabled':''}>»</button>
      </span></div>`;

    host.querySelectorAll('th[data-k]').forEach(t=>{
      const c=cols.find(x=>x.key===t.dataset.k); if(c.sort===false) return;
      t.onclick=()=>{ if(st.sort===t.dataset.k) st.dir*=-1; else{st.sort=t.dataset.k;st.dir=1;} st.render(); };
    });
    host.querySelectorAll('[data-pg]').forEach(b=>b.onclick=()=>{st.pag=+b.dataset.pg;st.render();});
    host.querySelector('[data-per]').onchange=e=>{st.per=+e.target.value;st.pag=1;st.render();};
    if(onRow) host.querySelectorAll('tbody tr[data-i]').forEach(tr=>{
      tr.style.cursor='pointer';
      tr.ondblclick=()=>onRow(page[+tr.dataset.i]);
      tr.onclick=e=>{ if(e.target.closest('button,input,select')) return;
        if(onSel){ st.selId=page[+tr.dataset.i][st.selKey||'id']; onSel(page[+tr.dataset.i]); } };
    });
    st.datosVisibles=data;
  },

  /* Menú de acciones secundarias */
  _mas:[],
  mas(items){
    UI._mas=items;
    if(!items.length) return '';
    return `<span class="mas"><button class="btn" data-mas-btn title="Más acciones">⋮</button>
      <span class="mas-lista">${items.map((i,k)=>
        `<button class="btn" data-mas-i="${k}">${U.esc(i.txt)}</button>`).join('')}</span></span>`;
  },
  bindMas(){
    const b=document.querySelector('[data-mas-btn]'); if(!b) return;
    const lista=b.parentElement.querySelector('.mas-lista');
    b.onclick=e=>{ e.stopPropagation(); lista.classList.toggle('on'); };
    lista.querySelectorAll('[data-mas-i]').forEach(x=>x.onclick=()=>{
      lista.classList.remove('on');
      const it=UI._mas[+x.dataset.masI]; if(it&&it.fn) it.fn();
    });
  },
  modal(titulo,cuerpo,acciones){
    const host=document.getElementById('modal-host');
    host.innerHTML=`<div class="mask"><div class="modal">
      <div class="panel-hd">${U.esc(titulo)}<button class="btn xs" data-x>Cerrar</button></div>
      <div class="panel-bd">${cuerpo}</div>
      <div class="modal-ft">${acciones.map((a,i)=>`<button class="btn ${a.cls||''}" data-a="${i}">${U.esc(a.txt)}</button>`).join('')}</div>
    </div></div>`;
    const cerrar=()=>host.innerHTML='';
    host.querySelector('[data-x]').onclick=cerrar;
    host.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{
      const a=acciones[+b.dataset.a];
      if(!a.fn||a.fn(host)!==false) cerrar();
    });
    const f=host.querySelector('input,select,textarea'); if(f) f.focus();
    return {cerrar,host};
  },
  confirmar(titulo,texto,fn){
    UI.modal(titulo,`<p>${U.esc(texto)}</p>`,[
      {txt:'Cancelar'},{txt:'Confirmar',cls:'pri',fn}
    ]);
  },
  barras(items,fmt){
    const max=Math.max(1,...items.map(i=>Math.abs(i.v)));
    return items.map(i=>`<div class="chart-row">
      <span class="cl" title="${U.esc(i.l)}">${U.esc(i.l)}</span>
      <span class="bar"><i class="${i.c||''}" style="width:${Math.abs(i.v)/max*100}%"></i></span>
      <span class="cv">${fmt?fmt(i.v):U.n(i.v)}</span></div>`).join('');
  }
};

/* ==========  5. PANTALLAS ============================================== */
const ST={};                      // estado de tablas por pantalla (persistente)
const VIEWS={};
const el=id=>document.getElementById(id);
const hd=(titulo,ruta,botones)=>`<div class="view-hd"><h1>${U.esc(titulo)}</h1>

/* EL CICLO DE VIDA, EN CORTO El conteo tiene dos estados y nada mas */

/* LA LINEA DE TRABAJO Cuatro pasos en fila, siempre en el mismo orden y siempre a la vista */
const ETAPAS_INV=['Planificar','Contar'];
const PEND_ETAPA={
  Planificar:()=>0,
  Contar    :()=>DB.conteos.filter(c=>c.estado==='ABIERTO').length
};
/* Cabecera de los dos pasos del trabajo. */
const hdInv=(etapa,sub,acc)=>
  `<div class="view-hd"><h1>Inventario</h1>
     <span class="crumb">${U.esc(sub||'')}</span>
     <span class="sp"><button class="btn" data-cargar>Cargar existencias</button>${acc||''}</span></div>
   ${avisoFoto()}
   <div class="etapas">
     ${ETAPAS_INV.map((e,i)=>
       `<button class="et ${e===etapa?'on':''}" data-et="${e}">
         <span class="n">${i+1}</span>${e}</button>`).join('')}
   </div>`;
/* Aviso de foto vieja */
const avisoFoto=()=>{
  const v=DB.fotoVieja();
  if(v===null) return `<div class="pista">Todavia no hay existencias cargadas.
    Use el boton Cargar existencias, arriba a la derecha.</div>`;
  if(v>1) return `<div class="pista">La foto de existencias es del ${DB.foto.fecha} (${U.n(v)} dias).
    Mientras mas vieja, menos vale la diferencia que se detecte: conviene volver a cargarla.</div>`;
  return '';
};
const bindEtapas=()=>{
  el('view').querySelectorAll('[data-et]').forEach(b=>
    b.onclick=()=>APP.ir('inventario',{etapa:b.dataset.et}));
  el('view').querySelectorAll('[data-cargar]').forEach(b=>
    b.onclick=()=>APP.ir('configuracion',{foco:'cargar'}));
};

VIEWS.inventario=(p)=>{
  ST.inv??={etapa:DB.conteos.some(c=>c.estado==='ABIERTO')?'Contar':'Planificar'};
  if(p&&p.etapa&&ETAPAS_INV.includes(p.etapa)) ST.inv.etapa=p.etapa;
  ({Planificar:VIEWS.nuevo, Contar:VIEWS.conteos})[ST.inv.etapa]({etapa:ST.inv.etapa});
};

/* EL ESTATUS DEL INVENTARIO TERMINADO Cuando un conteo se cierra sale de la etapa Contar y vive en Reportes con uno de estos tres estatus. */
/* Donde vive cada inventario */
const enConteo=c=>c.estado==='ABIERTO';
const enReportes=c=>c.estado==='CERRADO';

const EST_OK='CUADRÓ', EST_DIF='CON DIFERENCIAS', EST_INC='INCOMPLETO';
const ESTATUS=c=>{
  const a=DB.avance(c);
  if(c.estado==='ABIERTO')
    return {k:'EN CONTEO', cls:'b', accion:'Seguir contando', modo:'seguir',
            nota:a.h+' de '+a.t+' linea(s) contadas'};
  const sinContar=c.lineas.filter(l=>l.sinContar).length;
  const extra = sinContar?' - '+U.n(sinContar)+' linea(s) sin contar, fuera de la exactitud':'';
  const ab=DB.discAbiertas(c.id).length;
  const tuvo=DB.discDe(c.id).length;
  const conf=c.lineas.filter(l=>l.confirmada).length;
  /* ROJO: hubo diferencia real, este confirmada o en investigacion */
  if(ab)        return {k:EST_DIF, cls:'r', accion:'Reiniciar', modo:'reiniciar',
                        nota:U.n(ab)+' caso(s) sin resolver'+extra};
  if(tuvo||conf)return {k:EST_DIF, cls:'r', accion:'Reabrir', modo:'reabrir',
                        nota:U.n(conf)+' diferencia(s) confirmadas'+(tuvo?', '+U.n(tuvo)+' caso(s) resueltos':'')+extra};
  /* GRIS: lo contado cuadro, pero faltaron lineas */
  if(sinContar) return {k:EST_INC, cls:'n', accion:'Reiniciar', modo:'reiniciar',
                        nota:U.n(sinContar)+' de '+U.n(c.lineas.length)+' linea(s) nunca se contaron'};
  /* VERDE: se conto todo y cuadro todo */
  return {k:EST_OK, cls:'g', accion:'Reabrir', modo:'reabrir'};
};

/* ---------- 5.2 CONTEOS ---------- */

     este contando. En cuanto le da a Terminar, el inventario pasa a Resultados con su estatus.
     Empiece uno nuevo en Planificar.</div>
   </div></div>`;
